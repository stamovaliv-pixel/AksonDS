<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Управление днем - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .top-gradient-bar { width: 100%; height: 2px; background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end)); margin-bottom: 20px; }
    .hour-block { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: 15px; padding: 15px; }
    .hour-header { font-size: 18px; font-weight: 700; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 5px; }
    
    .cards-container { display: flex; flex-wrap: wrap; gap: 10px; }
    .booking-card { background: #f8fafc; border: 1px solid #cbd5e1; border-left: 4px solid #3b82f6; border-radius: var(--radius-sm); padding: 10px; cursor: pointer; flex: 1; min-width: 200px; font-size: 14px; transition: 0.2s; }
    .booking-card:hover { border-color: #3b82f6; transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    
    .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal-content { background: #fff; padding: 25px; border-radius: var(--radius-md); width: 400px; }
    .btn-red { background: #ef4444; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px;}
    .btn-save { background: #10b981; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px;}
  </style>
</head>
<body class="app-body">
  <div class="top-gradient-bar"></div>
  <main class="container mt-4">
    <a href="admin_calendar.html" style="color: #3b82f6; text-decoration: none;">&larr; Назад в календарь</a>
    <h2 style="margin: 20px 0;">Расписание на: <span id="dateDisplay"></span></h2>
    <div id="hoursContainer"></div>
  </main>

  <!-- Модальное окно редактирования -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; margin-bottom: 15px;">
        <h3 style="margin:0;">Редактирование</h3>
        <button id="closeModal" style="border:none; background:none; font-size:20px; cursor:pointer;">&times;</button>
      </div>
      <p><strong>Компания:</strong> <span id="mCompany"></span></p>
      <input type="hidden" id="mId">
      
      <div style="margin-bottom: 10px;">
        <label style="display:block; font-size:12px;">Время слота (Час)</label>
        <input type="number" id="mHour" min="9" max="17" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
      </div>
      <div style="margin-bottom: 10px;">
        <label style="display:block; font-size:12px;">Документ</label>
        <input type="text" id="mDoc" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
      </div>

      <button class="btn-save" id="btnUpdate">Сохранить изменения</button>
      <button class="btn-red" id="btnDelete">Удалить запись</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin_day.js"></script>
</body>
</html>
