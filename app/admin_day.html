<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление днем - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .app-header { margin-top: 0; box-shadow: none; border-bottom: none; padding-bottom: 15px; }
    .top-gradient-bar { width: 100%; height: 2px; background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end)); margin-bottom: 20px; }
    .header-nav { display: flex; gap: 20px; align-items: center; }
    .nav-icon { display: inline-flex; align-items: center; justify-content: center; padding: 5px; transition: transform 0.2s ease; text-decoration: none; }
    
    .hour-block { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: 20px; padding: 15px; }
    .hour-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 700; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
    
    /* ГОРИЗОНТАЛЬНАЯ СЕТКА СЛОТОВ */
    .cards-grid { 
      display: grid; 
      grid-template-columns: repeat(8, 1fr); 
      gap: 10px; 
    }
    
    /* Дизайн квадратика (иконки) слота */
    .slot-box {
      border: 1px solid #e2e8f0; 
      border-top: 4px solid; 
      border-radius: 6px; 
      padding: 10px;
      display: flex; 
      flex-direction: column; 
      height: 145px; /* Фиксированная высота для идеальной сетки */
      background: #fff; /* Строго белый фон, как в календаре */
      transition: all 0.2s ease;
      box-sizing: border-box;
      position: relative;
    }
    .slot-box:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-color: #cbd5e1; }

    /* Цветовая индикация (ТОЛЬКО верхняя полоска) */
    .main-empty { border-top-color: #3b82f6; cursor: pointer; }
    .main-empty:hover { background: #f0f9ff; } /* Легкая подсветка при наведении */
    .main-booked { border-top-color: #ef4444; }
    
    .res-empty { border-top-color: #94a3b8; cursor: pointer; }
    .res-empty:hover { background: #f8fafc; }
    .res-booked { border-top-color: #f59e0b; }

    /* Центрирование внутри пустых слотов */
    .sb-empty { justify-content: center; align-items: center; text-align: center; }
    .sb-empty-text { font-size: 13px; font-weight: 600; color: #64748b; line-height: 1.4; }
    
    /* Внутренности занятого слота */
    .sb-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
    .sb-title { font-size: 12px; font-weight: 700; color: #1e293b; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; word-break: break-word; }
    .btn-dots { background: none; border: none; font-size: 18px; line-height: 1; cursor: pointer; color: var(--color-text-muted); padding: 0 2px; }
    .btn-dots:hover { color: var(--color-primary); }

    .sb-icons { display: flex; justify-content: space-between; align-items: center; margin-bottom: auto; font-size: 16px; }
    
    /* Мигающая зеленая точка ТК */
    .tk-dot { width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; display: inline-block; box-shadow: 0 0 6px rgba(16, 185, 129, 0.6); animation: blink 1.5s infinite; flex-shrink: 0; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Компактные инпуты Прибыл/Убыл */
    .card-actions { display: flex; gap: 4px; margin-top: auto; }
    .inline-input-group { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .inline-input-group label { font-size: 9px; color: #64748b; text-transform: uppercase; font-weight: 600; }
    .inline-input-group input { width: 100%; height: 22px; font-size: 11px; padding: 0 2px; border: 1px solid #cbd5e1; border-radius: 3px; text-align: center; outline: none; background: #fff; box-sizing: border-box;}
    .inline-input-group input:focus { border-color: #3b82f6; }

    /* Модальные окна */
    .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
    .modal-content { background: #fff; padding: 25px; border-radius: var(--radius-md); width: 100%; max-width: 550px; position: relative; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--color-border); padding-bottom: 10px; }
    .modal-header h3 { margin: 0; font-size: 18px; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--color-text-main); }
    .form-group input[type="text"], .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px; box-sizing: border-box; font-size: 14px; outline: none; }
    .form-group input[type="text"]:focus, .form-group select:focus, .form-group textarea:focus { border-color: #3b82f6; }
    
    .btn-red { background: #ef4444; color: #fff; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 10px; }
    .btn-save { background: #10b981; color: #fff; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 20px; }

    /* Адаптив для сетки (если экран маленький) */
    @media (max-width: 1400px) { .cards-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 768px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .cards-grid { grid-template-columns: 1fr; } }

    /* Ограничения для роли VIEWER */
    body.role-viewer .viewer-hide { display: none !important; }
    body.role-viewer .viewer-disable { pointer-events: none !important; opacity: 0.6 !important; }
  </style>
</head>
<body class="app-body">
  <header class="app-header">
    <div class="header-logo"><img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo"></div>
    <div class="header-nav">
      <a href="admin_calendar.html" class="nav-icon" title="Календарь"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></a>
      <a href="suppliers.html" class="nav-icon viewer-hide" title="Пользователи"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></a>
      <a href="analytics.html" class="nav-icon viewer-hide" title="Аналитика"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><polyline points="3 3 3 21 21 21"></polyline><polyline points="3 17 9 11 13 15 21 7"></polyline></svg></a>
      <a href="settings.html" class="nav-icon viewer-hide" title="Настройки"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></a>
      <a href="#" id="logoutBtn" class="nav-icon" title="Выйти"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></a>
    </div>
  </header>
  <div class="top-gradient-bar"></div>
  
  <main class="container" style="max-width: 1600px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <a href="admin_calendar.html" style="color: #3b82f6; text-decoration: none; font-weight: 500;">&larr; Назад</a>
      <h2 style="margin: 0; font-size: 20px;">Слоты на: <span id="dateDisplay" style="color: var(--color-primary);">...</span></h2>
    </div>
    <div id="hoursContainer">
      <div style="padding: 40px; text-align: center; color: var(--color-text-muted);">Загрузка расписания...</div>
    </div>
  </main>

  <!-- Модальное окно РЕДАКТИРОВАНИЯ (Подробностей) -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="mTitle">Подробности записи</h3>
        <button id="closeEditModal" style="border:none; background:none; font-size:24px; cursor:pointer; color: #64748b;">&times;</button>
      </div>
      
      <input type="hidden" id="mId">
      
      <div class="form-group" style="background: #f8fafc; padding: 10px; border-radius: 4px; border: 1px solid #e2e8f0;">
        <label>Поставщик</label>
        <div id="mCompany" style="font-weight: 600; color: #1e293b;"></div>
      </div>
      
      <div class="form-group">
        <label>Номер документа</label>
        <input type="text" id="mDoc" class="viewer-disable">
      </div>

      <div class="form-group">
        <label>Тип поставки</label>
        <div id="mSupplyTypesGroup" style="display: flex; gap: 10px; flex-wrap: wrap;" class="viewer-disable"></div>
      </div>

      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
          <label>Тип документа</label>
          <select id="mOrderType" class="viewer-disable">
            <option value="order">Заказ</option>
            <option value="upd">УПД</option>
            <option value="etrn">ЭТрН</option>
          </select>
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Время слота</label>
          <select id="mHour" class="viewer-disable"></select>
        </div>
      </div>

      <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="mIsTk" class="viewer-disable" style="width: 16px; height: 16px;">
        <label style="margin:0;">Признак ТК</label>
      </div>

      <div class="form-group">
        <label>Комментарий</label>
        <textarea id="mComment" class="viewer-disable" rows="2" maxlength="320"></textarea>
      </div>

      <div class="form-group">
        <label>Реестр поставки</label>
        <a id="mFileLink" href="#" target="_blank" style="color: #3b82f6; display: none; margin-bottom: 10px;">Скачать текущий файл (.csv)</a>
      </div>

      <button class="btn-save viewer-hide" id="btnUpdate">Сохранить изменения</button>
      <button class="btn-red viewer-hide" id="btnDelete">Удалить запись</button>
    </div>
  </div>

  <!-- Модальное окно СОЗДАНИЯ -->
  <div class="modal-overlay" id="createModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Добавить запись</h3>
        <button id="closeCreateModal" style="border:none; background:none; font-size:24px; cursor:pointer; color: #64748b;">&times;</button>
      </div>
      
      <form id="createForm">
        <input type="hidden" id="cHour">
        
        <div class="form-group">
          <label>Поставщик (ИНН/Название)</label>
          <input type="text" id="cSupplierSearch" list="suppliersList" required autocomplete="off">
          <datalist id="suppliersList"></datalist>
        </div>

        <div class="form-group">
          <label>Тип поставки</label>
          <div id="cSupplyTypesGroup" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
        </div>

        <div style="display: flex; gap: 10px;">
          <div class="form-group" style="flex: 1;">
            <label>Тип документа</label>
            <select id="cOrderType" required>
              <option value="order">Заказ</option>
              <option value="upd">УПД</option>
              <option value="etrn">ЭТрН</option>
            </select>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Номер документа</label>
            <input type="text" id="cDoc" required>
          </div>
        </div>

        <div class="form-group">
          <label>Реестр поставки (.csv)</label>
          <input type="file" id="cRegistryFile" accept=".csv">
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="cIsTk" style="width: 16px; height: 16px;">
          <label style="margin:0;">Признак ТК</label>
        </div>

        <div class="form-group">
          <label>Комментарий</label>
          <textarea id="cComment" rows="2" maxlength="320"></textarea>
        </div>

        <button type="submit" class="btn-save" id="btnCreate">Записать поставщика</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/admin_day.js?v=7"></script>
</body>
</html>
