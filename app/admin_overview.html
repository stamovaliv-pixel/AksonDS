<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f9">
  <title>Обзор — AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css?v=4-1-date-exceptions">
  <link rel="stylesheet" href="../css/main.css?v=4-1-date-exceptions">
  <link rel="stylesheet" href="../css/dark-mode.css?v=4">
  <link rel="stylesheet" href="../css/mobile-refinements.css?v=2">
  <link rel="stylesheet" href="../css/admin-navigation.css?v=1">
  <link rel="stylesheet" href="../css/admin-overview.css?v=4-stickers-export">
  <script>
    try {
      if (localStorage.getItem('akson-dockslot-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (error) { /* localStorage may be unavailable in private contexts */ }
  </script>
</head>
<body class="app-body overview-page">
  <div class="top-gradient-bar"></div>
  <header class="app-header">
    <div class="header-logo"><img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo"></div>
    <nav class="header-nav" aria-label="Административная навигация">
      <button class="theme-toggle" type="button" data-theme-toggle title="Темный режим" aria-label="Темный режим">
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.463.402.807a6.5 6.5 0 0 0 8.268 8.268c.344-.215.829-.003.803.397Z"></path></svg>
      </button>
      <a href="admin_overview.html" class="nav-icon admin-overview-link active" title="Обзор" aria-label="Обзор" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><rect x="3" y="3" width="8" height="8" rx="1.5"></rect><rect x="13" y="3" width="8" height="5" rx="1.5"></rect><rect x="13" y="10" width="8" height="11" rx="1.5"></rect><rect x="3" y="13" width="8" height="8" rx="1.5"></rect></svg>
      </a>
      <a href="admin_calendar.html" class="nav-icon" title="Календарь" aria-label="Календарь"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></a>
      <a href="suppliers.html" class="nav-icon viewer-hide" title="Пользователи" aria-label="Пользователи"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></a>
      <a href="analytics.html" class="nav-icon viewer-hide" title="Аналитика" aria-label="Аналитика"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 3v18h18M3 17l6-6 4 4 8-8"></path></svg></a>
      <a href="settings.html" class="nav-icon viewer-hide" title="Настройки" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="m19.4 15 .06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V19a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 0 1.74Z"></path></svg></a>
      <a href="#" id="logoutBtn" class="nav-icon" title="Выйти" aria-label="Выйти"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5M21 12H9"></path></svg></a>
    </nav>
  </header>

  <main class="overview-wrap">
    <header class="overview-page-head">
      <div>
        <h1>Обзор</h1>
        <p class="overview-subtitle">Оперативная сводка заявок и личные задачи администратора</p>
      </div>
      <div class="overview-date-caption" id="dateCaption" aria-live="polite">Загрузка данных…</div>
    </header>

    <section class="overview-filters" aria-label="Фильтры заявок">
      <div class="overview-filter-group">
        <label for="dateFilter">Дата заявок</label>
        <input type="date" id="dateFilter">
      </div>
      <div class="overview-filter-group">
        <label for="supplierFilter">Поставщик / ИНН</label>
        <input type="search" id="supplierFilter" placeholder="Название или ИНН" autocomplete="off">
      </div>
      <div class="overview-filter-group">
        <label for="docFilter">Номер документа</label>
        <input type="search" id="docFilter" placeholder="Номер документа" autocomplete="off">
      </div>
      <div class="overview-filter-group">
        <label for="supplyFilter">Тип поставки</label>
        <select id="supplyFilter"><option value="">Все типы</option></select>
      </div>
      <div class="overview-filter-group">
        <label for="orderFilter">Тип документа</label>
        <select id="orderFilter">
          <option value="">Все документы</option>
          <option value="order">Заказ</option>
          <option value="upd">УПД</option>
          <option value="etrn">ЭТрН</option>
        </select>
      </div>
      <div class="overview-filter-actions">
        <button type="button" class="overview-btn overview-btn-primary" id="applyBtn">Применить</button>
        <button type="button" class="overview-btn overview-btn-secondary" id="resetBtn">Сбросить</button>
        <button type="button" class="overview-export-btn" id="exportBtn" title="Выбрать разделы для выгрузки" aria-label="Выбрать разделы для выгрузки" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 3h10l4 4v14H5z"></path><path d="M15 3v5h4M12 11v7m-3-3 3 3 3-3"></path></svg>
        </button>
      </div>
    </section>

    <div class="overview-state" id="overviewState" role="status" aria-live="polite"></div>

    <section class="overview-metrics" aria-label="Сводка заявок" id="overviewMetrics">
      <article class="overview-metric-shell" data-export-shell="all">
        <button type="button" class="overview-metric total" data-kind="all" aria-controls="listPanel">
          <span class="overview-metric-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"></path><path d="M3 6h.01M3 12h.01M3 18h.01"></path></svg></span>
          <span class="overview-metric-copy"><span class="overview-metric-label">Всего заявок</span><strong class="overview-metric-value" id="totalCount">—</strong><span class="overview-metric-hint">Все активные заявки на дату</span></span>
        </button>
        <label class="overview-export-choice" hidden><input type="checkbox" data-export-kind="all"><span>Включить в реестр</span></label>
      </article>
      <article class="overview-metric-shell" data-export-shell="unverified">
        <button type="button" class="overview-metric unverified" data-kind="unverified" aria-controls="listPanel">
          <span class="overview-metric-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M12 11v4m0 3h.01"></path></svg></span>
          <span class="overview-metric-copy"><span class="overview-metric-label">Не верифицированы</span><strong class="overview-metric-value" id="unverifiedCount">—</strong><span class="overview-metric-hint">Заявки без подтверждения</span></span>
        </button>
        <label class="overview-export-choice" hidden><input type="checkbox" data-export-kind="unverified"><span>Включить в реестр</span></label>
      </article>
      <article class="overview-metric-shell" data-export-shell="returns">
        <button type="button" class="overview-metric returns" data-kind="returns" aria-controls="listPanel">
          <span class="overview-metric-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-2"></path></svg></span>
          <span class="overview-metric-copy"><span class="overview-metric-label">Возвраты</span><strong class="overview-metric-value" id="returnCount">—</strong><span class="overview-metric-hint">Поставка с типом «Возврат»</span></span>
        </button>
        <label class="overview-export-choice" hidden><input type="checkbox" data-export-kind="returns"><span>Включить в реестр</span></label>
      </article>
    </section>
    <section class="overview-list-panel" id="listPanel" hidden>
      <div class="overview-panel-head">
        <div><h2 id="listTitle">Заявки</h2><p class="overview-panel-subtitle" id="listSubtitle"></p></div>
        <button type="button" class="overview-btn overview-btn-secondary" id="closeList">Скрыть</button>
      </div>
      <div class="overview-booking-list" id="bookingList"></div>
    </section>

    <section class="overview-workspace" aria-label="Личные заметки и напоминания">
      <section class="overview-panel overview-personal-panel overview-notes-panel" aria-labelledby="notesHeading">
        <div class="overview-panel-head">
          <div class="overview-panel-title-wrap"><span class="overview-panel-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M8 13h8M8 17h5"></path></svg></span><h2 id="notesHeading">Личные заметки</h2></div>
          <button type="button" class="overview-add-btn" id="addNoteBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>Добавить заметку</span></button>
        </div>
        <div class="overview-personal-list" id="notesList"><div class="overview-empty">Загрузка заметок…</div></div>
      </section>

      <section class="overview-panel overview-personal-panel overview-reminders-panel" aria-labelledby="remindersHeading">
        <div class="overview-panel-head">
          <div class="overview-panel-title-wrap"><span class="overview-panel-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span><h2 id="remindersHeading">Напоминания</h2></div>
          <button type="button" class="overview-add-btn overview-add-btn-reminder" id="addReminderBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>Добавить напоминание</span></button>
        </div>
        <div class="overview-personal-list" id="remindersList"><div class="overview-empty">Загрузка напоминаний…</div></div>
      </section>
    </section>
  </main>


  <dialog class="overview-modal" id="noteModal" aria-labelledby="noteModalTitle">
    <form class="overview-modal-card" id="notesForm">
      <header class="overview-modal-head">
        <div><span class="overview-modal-kicker">Личная заметка</span><h2 id="noteModalTitle">Новая заметка</h2></div>
        <button type="button" class="overview-modal-close" data-close-dialog="noteModal" aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg></button>
      </header>
      <div class="overview-modal-fields">
        <input type="hidden" id="noteId">
        <label>Заголовок <span>необязательно</span><input type="text" id="noteTitle" maxlength="160" placeholder="Например, важный звонок"></label>
        <label>Текст заметки<textarea id="noteContent" maxlength="8000" rows="5" placeholder="Запишите важную информацию…" required></textarea></label>
      </div>
      <footer class="overview-modal-actions">
        <button type="button" class="overview-btn overview-btn-secondary" data-close-dialog="noteModal">Отмена</button>
        <button type="submit" class="overview-btn overview-btn-primary" id="saveNoteBtn">Сохранить заметку</button>
      </footer>
    </form>
  </dialog>

  <dialog class="overview-modal" id="reminderModal" aria-labelledby="reminderModalTitle">
    <form class="overview-modal-card" id="reminderForm">
      <header class="overview-modal-head">
        <div><span class="overview-modal-kicker">Личная задача</span><h2 id="reminderModalTitle">Новое напоминание</h2></div>
        <button type="button" class="overview-modal-close" data-close-dialog="reminderModal" aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg></button>
      </header>
      <div class="overview-modal-fields">
        <label>О чём напомнить?<textarea id="reminderText" maxlength="2000" rows="4" placeholder="Текст напоминания…" required></textarea></label>
        <label>Дата и время<input type="datetime-local" id="reminderAt" required aria-label="Дата и время напоминания"></label>
      </div>
      <footer class="overview-modal-actions">
        <button type="button" class="overview-btn overview-btn-secondary" data-close-dialog="reminderModal">Отмена</button>
        <button type="submit" class="overview-btn overview-btn-primary" id="saveReminderBtn">Сохранить напоминание</button>
      </footer>
    </form>
  </dialog>

  <div class="overview-toast" id="overviewToast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js?v=security-20261023"></script>
  <script src="../js/admin-navigation.js?v=1"></script>
  <script src="../js/admin_overview.js?v=4-stickers-export"></script>
  <script src="../js/theme-toggle.js?v=3"></script>
</body>
</html>
