<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Обзор — AKSon Logistics</title>
<link rel="stylesheet" href="../css/theme.css?v=admin-overview-2"><link rel="stylesheet" href="../css/main.css?v=admin-overview-2"><link rel="stylesheet" href="../css/dark-mode.css?v=admin-overview-2"><link rel="stylesheet" href="../css/mobile-refinements.css?v=2">
<style>
.app-header{margin-top:0;box-shadow:none;border-bottom:1px solid var(--color-border)}.top-gradient-bar{height:2px;background:linear-gradient(90deg,var(--color-gradient-start),var(--color-gradient-end))}
.overview-wrap{max-width:1320px;margin:0 auto;padding:22px}.overview-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}.overview-head h1{font-size:25px;margin:0;color:var(--color-text-main)}
.filters-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:18px;display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.filter-group{display:flex;flex-direction:column;gap:5px;min-width:145px;flex:1}.filter-group label{font-size:13px;color:var(--color-text-muted)}.filter-group input,.filter-group select{padding:10px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text-main)}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}.btn-primary{background:#3b82f6;color:#fff}.btn-muted{background:var(--color-bg);color:var(--color-text-main);border:1px solid var(--color-border)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:22px}.metric{border:1px solid var(--color-border);background:var(--color-surface);border-radius:14px;padding:20px;text-align:left;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .18s,border-color .18s;color:var(--color-text-main)}.metric:hover{transform:translateY(-2px);border-color:#60a5fa}.metric-label{font-size:14px;color:var(--color-text-muted);display:block}.metric-value{font-size:34px;font-weight:750;display:block;margin-top:8px;line-height:1.1}.metric-hint{font-size:12px;color:var(--color-text-muted);display:block;margin-top:8px}.metric.total{cursor:default}.list-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm)}.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.list-head h2{font-size:18px;margin:0}.booking-row{display:grid;grid-template-columns:90px minmax(170px,1fr) minmax(120px,.7fr) 130px 42px;gap:12px;align-items:center;padding:13px 8px;border-top:1px solid var(--color-border)}.muted{color:var(--color-text-muted);font-size:13px}.verify-btn{width:32px;height:32px;min-width:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;border:1px solid transparent;background:rgba(239,68,68,.10);color:#dc5555;cursor:pointer;padding:5px;transition:background .18s ease,box-shadow .18s ease,transform .18s ease}.verify-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.verify-btn:hover{transform:translateY(-1px)}.verify-btn.on{background:rgba(34,197,94,.15);color:#16a34a;border-color:rgba(34,197,94,.24);box-shadow:0 0 0 3px rgba(34,197,94,.13)}.verify-btn.off{animation:verifyPulse 1.8s ease-in-out infinite}@keyframes verifyPulse{50%{box-shadow:0 0 0 4px rgba(239,68,68,.22)}}.empty{padding:30px;text-align:center;color:var(--color-text-muted)}
@media(max-width:760px){.metrics{grid-template-columns:1fr}.booking-row{grid-template-columns:64px 1fr 36px}.booking-row .extra{display:none}.overview-wrap{padding:14px}}
</style><script>try{if(localStorage.getItem("akson-dockslot-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script></head>
<body class="app-body"><div class="top-gradient-bar"></div><header class="app-header"><div class="header-logo"><img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo"></div><nav class="header-nav"><button class="theme-toggle" type="button" data-theme-toggle title="Темный режим" aria-label="Темный режим"><svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.463.402.807a6.5 6.5 0 0 0 8.268 8.268c.344-.215.829-.003.803.397Z"></path></svg></button><a class="nav-icon" href="admin_calendar.html" title="Календарь">📅</a><a class="nav-icon" href="suppliers.html" title="Пользователи">👥</a><a class="nav-icon" href="#" id="logoutBtn" title="Выйти">↪</a></nav></header>
<main class="overview-wrap"><div class="overview-head"><h1>Обзор заявок</h1><span class="muted" id="dateCaption">Загрузка данных…</span></div>
<section class="filters-card"><div class="filter-group"><label for="dateFilter">Дата заявок</label><input type="date" id="dateFilter"></div><div class="filter-group"><label for="supplierFilter">Поставщик / ИНН</label><input id="supplierFilter" placeholder="Поиск поставщика или ИНН"></div><div class="filter-group"><label for="docFilter">Номер документа</label><input id="docFilter" placeholder="Номер документа"></div><div class="filter-group"><label for="supplyFilter">Тип поставки</label><select id="supplyFilter"><option value="">Все типы</option></select></div><div class="filter-group"><label for="orderFilter">Тип документа</label><select id="orderFilter"><option value="">Все типы</option><option value="order">Заказ</option><option value="upd">УПД</option><option value="etrn">ЭТрН</option></select></div><button class="btn btn-primary" id="applyBtn">Применить</button><button class="btn btn-muted" id="resetBtn">Сбросить</button><button class="btn btn-muted" id="exportBtn">↓ Консолидированный CSV</button></section>
<section class="metrics"><div class="metric total"><span class="metric-label">Всего заявок на выбранную дату</span><strong class="metric-value" id="totalCount">—</strong><span class="metric-hint">Все активные заявки</span></div><button class="metric" data-kind="unverified"><span class="metric-label">Не верифицированы</span><strong class="metric-value" id="unverifiedCount">—</strong><span class="metric-hint">Нажмите, чтобы открыть список</span></button><button class="metric" data-kind="returns"><span class="metric-label">Тип поставки «Возврат»</span><strong class="metric-value" id="returnCount">—</strong><span class="metric-hint">Нажмите, чтобы открыть список</span></button></section>
<section class="list-panel" id="listPanel" hidden><div class="list-head"><h2 id="listTitle">Заявки</h2><button class="btn btn-muted" id="closeList">Скрыть список</button></div><div id="bookingList"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-client.js?v=security-20261023"></script><script src="../js/admin_overview.js?v=2-file-verification"></script><script src="../js/theme-toggle.js?v=3"></script></body></html>
