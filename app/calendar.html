<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь записей - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* Сетка для разделения на 2 колонки */
    .calendar-layout {
      display: flex;
      gap: 30px;
      align-items: flex-start;
      margin-top: 20px;
    }
    @media (max-width: 900px) {
      .calendar-layout { flex-direction: column; }
    }
    
    .grid-section {
      flex: 1;
      width: 100%;
    }
    .upcoming-section {
      flex: 0 0 320px;
      width: 100%;
    }

    /* Сетка календаря (строго 7 колонок) */
    .weekdays-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      margin-bottom: 10px;
      text-align: center;
      font-weight: 600;
      color: var(--color-text-muted);
      font-size: 14px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }
    
    /* Стили ячеек календаря */
    .day-cell {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: 15px 5px;
      border-radius: var(--radius-sm);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .day-cell:hover:not(.inactive) {
      border-color: var(--color-primary);
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.05);
    }
    
    /* Полоска по умолчанию - серая */
    .day-cell::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background-color: #cbd5e1; 
      transition: background-color 0.3s;
    }
    /* Если есть запись - зеленая */
    .day-cell.booked::before {
      background-color: #10b981; 
    }
    
    /* Неактивные дни (прошлое и > 30 дней) */
    .day-cell.inactive {
      opacity: 0.4;
      background-color: #f1f5f9;
      cursor: default;
      pointer-events: none; /* Запрет клика */
      box-shadow: none;
    }
    .day-cell.inactive::before {
      display: none; /* Убираем полоску у неактивных дней */
    }

    .date-text { font-size: 16px; font-weight: 700; color: var(--color-text-main); }
    
    /* Карточки ближайших записей */
    .booking-item {
      padding: 15px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      border-left: 4px solid var(--color-primary);
      background: #fff;
    }
    .booking-item:last-child { margin-bottom: 0; }
    .booking-date { font-weight: 600; color: var(--color-text-main); font-size: 15px; }
    .booking-time { font-size: 14px; color: var(--color-text-muted); margin-top: 4px; }
  </style>
</head>
<body class="app-body">
  <div class="top-gradient-bar"></div>
  <header class="app-header">
    <div class="header-logo">
      <img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo">
    </div>
    <div class="header-nav">
      <a href="dashboard.html">Личный кабинет</a>
      <a href="calendar.html" class="active">Календарь</a>
      <a href="#" id="logoutBtn" style="color: var(--color-primary);">Выйти</a>
    </div>
  </header>
  
  <main class="container mt-4">
    <div class="calendar-layout">
      
      <!-- Левая колонка: Календарь -->
      <div class="grid-section">
        <h1 class="page-title" style="margin-top: 0; margin-bottom: 25px;">Выберите дату</h1>
        
        <div class="weekdays-header">
          <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
        </div>
        <div class="calendar-grid" id="calendarGrid" oncontextmenu="return false;"></div>
      </div>

      <!-- Правая колонка: Ближайшие записи -->
      <div class="upcoming-section">
        <h3 class="page-title" style="margin-top: 0; margin-bottom: 25px;">Мои записи</h3>
        <div class="auth-card" style="padding: 20px; margin-top: 0; max-width: none;">
          <div id="upcomingBookingsList">
            <div class="text-center" style="color: var(--color-text-muted); font-size: 14px;">Загрузка...</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/calendar.js"></script>
</body>
</html>
