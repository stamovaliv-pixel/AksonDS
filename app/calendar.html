<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь записей - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* Убираем отступ сверху у шапки и тень */
    .app-header {
      margin-top: 0;
      box-shadow: none; 
      border-bottom: none;
      padding-bottom: 15px; /* Немного отступа до полосы */
    }
    
    /* Градиентная полоса на всю ширину под шапкой */
    .top-gradient-bar {
      width: 100%;
      height: 4.8px; 
      background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end));
      margin-bottom: 20px; /* Отступ от полосы до контента */
    }

    .calendar-layout {
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }
    
    .grid-section {
      flex: 1;
      width: 100%;
      border-right: 1px solid rgba(0, 0, 0, 0.1);
      padding-right: 30px;
    }
    
    .upcoming-section {
      flex: 0 0 430px; 
      width: 100%;
    }

    @media (max-width: 1000px) {
      .calendar-layout { flex-direction: column; }
      .grid-section { border-right: none; padding-right: 0; border-bottom: 1px solid rgba(0, 0, 0, 0.1); padding-bottom: 30px; }
      .upcoming-section { flex: auto; }
    }
    
    /* Унифицированные заголовки для выравнивания */
    .section-title {
      margin: 0 0 25px 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
      color: var(--color-text-main);
      height: 28px; /* Фиксируем высоту заголовка */
    }

    /* Сетка календаря */
    .weekdays-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
      margin-bottom: 12px; 
      text-align: center;
      font-weight: 600;
      color: var(--color-text-muted);
      font-size: 14px;
      height: 20px; 
      line-height: 20px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px; 
    }
    
    /* Стили ячеек календаря */
    .day-cell {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      height: 75px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .day-cell:hover:not(.inactive) {
      border-color: var(--color-primary);
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.05);
    }
    
    /* Полоска свободных дней (зеленая, прозрачность 80%) */
    .day-cell::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background-color: rgba(16, 185, 129, 0.8); 
    }
    /* Полоска занятых дней (красная) */
    .day-cell.booked::before {
      background-color: var(--color-primary); 
    }
    
    /* Неактивные дни */
    .day-cell.inactive {
      opacity: 0.4;
      background-color: #f1f5f9;
      cursor: default;
      pointer-events: none;
      box-shadow: none;
    }
    .day-cell.inactive::before {
      display: none; 
    }

    .date-text { font-size: 16px; font-weight: 700; color: var(--color-text-main); }
    
    /* Список ближайших записей */
    .booking-list {
      display: flex;
      flex-direction: column;
      gap: 12px; 
      /* Отступ сверху строго равен высоте шапки дней (20) + отступ (12) */
      margin-top: 32px; 
    }

    /* Карточки слотов */
    .booking-item {
      padding: 0 15px;
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-primary); /* Возвращаем красную полосу налево */
      border-radius: var(--radius-sm);
      background: #fff;
      height: 75px; /* Идеально совпадает с иконкой даты */
      display: flex;
      flex-direction: row; 
      justify-content: space-between; 
      align-items: center; 
      box-sizing: border-box;
      position: relative;
    }
    
    /* Левый блок (дата и время) - не сжимается */
    .booking-left { 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
      flex-shrink: 0; 
    }
    
    /* Правый блок (тип и док) - занимает оставшееся место, обрезает длинный текст */
    .booking-right { 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
      text-align: right; 
      flex: 1; 
      min-width: 0; /* Обязательно для работы ellipsis во flexbox */
      margin-left: 15px;
    }
    
    /* Класс для обрезки длинного текста с многоточием */
    .truncate-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    
    .booking-date { font-weight: 600; color: var(--color-text-main); font-size: 15px; }
    .booking-time { font-size: 14px; color: var(--color-text-muted); }
  </style>
</head>
<body class="app-body">
  <header class="app-header">
    <div class="header-logo">
      <img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo">
    </div>
    <div class="header-nav">
      <a href="dashboard.html">Личный кабинет</a>
      <a href="calendar.html" class="active">Календарь</a>
      <a href="#" id="logoutBtn" style="color: var(--color-primary);">Выйти</a>
    </div>
  </header>
  
  <!-- Градиентная полоса вынесена под шапку -->
  <div class="top-gradient-bar"></div>
  
  <main class="container">
    <div class="calendar-layout">
      
      <!-- Левая колонка: Календарь -->
      <div class="grid-section">
        <h2 class="section-title">Календарь</h2>
        
        <div class="weekdays-header">
          <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
        </div>
        <div class="calendar-grid" id="calendarGrid" oncontextmenu="return false;"></div>
      </div>

      <!-- Правая колонка: Ближайшие слоты -->
      <div class="upcoming-section">
        <h2 class="section-title">Мои слоты</h2>
        <div id="upcomingBookingsList" class="booking-list">
          <div class="text-center" style="color: var(--color-text-muted); font-size: 14px;">Загрузка...</div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/calendar.js"></script>
</body>
</html>
