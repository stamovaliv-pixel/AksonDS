<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь записей - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 15px;
      margin-top: 25px;
    }
    .day-cell {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: 20px 15px;
      border-radius: var(--radius-sm);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }
    .day-cell:hover {
      border-color: var(--color-primary);
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.05);
    }
    /* Индикатор свободного дня (зеленая полоска) */
    .day-cell.free::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background-color: #10b981; 
    }
    .date-text { font-size: 18px; font-weight: 700; color: var(--color-text-main); }
    .day-text { font-size: 14px; font-weight: 500; color: var(--color-text-muted); margin-top: 4px; }
  </style>
</head>
<body class="app-body">
  <div class="top-gradient-bar"></div>
  <header class="app-header">
    <div class="header-logo">
      <img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo">
    </div>
    <div class="header-nav">
      <a href="dashboard.html">Личный кабинет</a>
      <a href="calendar.html" class="active">Календарь</a>
      <a href="#" id="logoutBtn" style="color: var(--color-primary);">Выйти</a>
    </div>
  </header>
  
  <main class="container mt-4">
    <h1 class="page-title">Выбор даты (ближайшие 30 дней)</h1>
    <!-- Сюда сгенерируются карточки дней -->
    <div class="calendar-grid" id="calendarGrid" oncontextmenu="return false;"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/calendar.js"></script>
</body>
</html>
