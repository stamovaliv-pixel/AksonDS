<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь записей - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* Убираем отступ сверху у шапки, так как полоса теперь снизу */
    .app-header {
      margin-top: 0;
      box-shadow: none; /* Уберем тень шапки, чтобы градиент смотрелся чище */
    }
    
    /* Новая градиентная полоса (под шапкой, тоньше на 20%) */
    .top-gradient-bar {
      width: 100%;
      height: 4.8px; 
      background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end));
      box-shadow: var(--shadow-sm); /* Перенесем тень на саму полосу */
    }

    /* Сетка для разделения на 2 колонки */
    .calendar-layout {
      display: flex;
      gap: 30px;
      align-items: flex-start;
      margin-top: 20px;
    }
    
    .grid-section {
      flex: 1;
      width: 100%;
      border-right: 1px solid rgba(0, 0, 0, 0.1);
      padding-right: 30px;
    }
    
    /* Ширина блока "Мои слоты" увеличена в 1.5 раза (было 320px, стало 480px) */
    .upcoming-section {
      flex: 0 0 480px; 
      width: 100%;
    }

    @media (max-width: 1000px) {
      .calendar-layout { flex-direction: column; }
      .grid-section { border-right: none; padding-right: 0; border-bottom: 1px solid rgba(0, 0, 0, 0.1); padding-bottom: 30px; }
      .upcoming-section { flex: auto; }
    }

    /* Сетка календаря */
    .weekdays-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
      margin-bottom: 15px; /* Фиксированный отступ */
      text-align: center;
      font-weight: 600;
      color: var(--color-text-muted);
      font-size: 14px;
      height: 20px; /* Фиксированная высота для выравнивания соседней колонки */
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px; /* Одинаковый отступ по вертикали и горизонтали */
    }
    
    /* Стили ячеек календаря (фиксированная высота) */
    .day-cell {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      height: 75px; /* Фиксированная высота иконки даты */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .day-cell:hover:not(.inactive) {
      border-color: var(--color-primary);
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.05);
    }
    
    /* Полоска по умолчанию - зеленая (прозрачность 80%) */
    .day-cell::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background-color: rgba(16, 185, 129, 0.8); 
      transition: background-color 0.3s;
    }
    /* Если есть запись - красная */
    .day-cell.booked::before {
      background-color: var(--color-primary); 
    }
    
    /* Неактивные дни */
    .day-cell.inactive {
      opacity: 0.4;
      background-color: #f1f5f9;
      cursor: default;
      pointer-events: none;
      box-shadow: none;
    }
    .day-cell.inactive::before {
      display: none; 
    }

    .date-text { font-size: 16px; font-weight: 700; color: var(--color-text-main); }
    
    /* Список ближайших записей */
    .booking-list {
      display: flex;
      flex-direction: column;
      gap: 12px; /* Точно такой же отступ, как в calendar-grid */
      margin-top: 35px; /* 20px (высота weekdays-header) + 15px (отступ margin-bottom) = 35px. Идеальное совпадение */
    }

    /* Карточки слотов (горизонтальная компоновка) */
    .booking-item {
      padding: 0 20px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      border-left: 4px solid var(--color-primary);
      background: #fff;
      height: 75px; /* Фиксированная высота точно как у иконки даты */
      display: flex;
      flex-direction: row; /* Располагаем блоки в строку */
      justify-content: space-between; /* Раздвигаем влево и вправо */
      align-items: center; /* Центрируем по вертикали */
      box-shadow: var(--shadow-sm);
      box-sizing: border-box;
    }
    
    .booking-left { display: flex; flex-direction: column; gap: 4px; }
    .booking-right { display: flex; flex-direction: column; gap: 4px; text-align: right; }
    
    .booking-date { font-weight: 600; color: var(--color-text-main); font-size: 15px; }
    .booking-time { font-size: 14px; color: var(--color-text-muted); }
  </style>
</head>
<body class="app-body">
  <header class="app-header">
    <div class="header-logo">
      <img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo">
    </div>
    <div class="header-nav">
      <a href="dashboard.html">Личный кабинет</a>
      <a href="calendar.html" class="active">Календарь</a>
      <a href="#" id="logoutBtn" style="color: var(--color-primary);">Выйти</a>
    </div>
  </header>
  <!-- Градиентная полоса перенесена сюда -->
  <div class="top-gradient-bar"></div>
  
  <main class="container mt-4">
    <div class="calendar-layout">
      
      <!-- Левая колонка: Календарь -->
      <div class="grid-section">
        <h1 class="page-title" style="margin-top: 0; margin-bottom: 25px;">График записи</h1>
        
        <div class="weekdays-header">
          <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
        </div>
        <div class="calendar-grid" id="calendarGrid" oncontextmenu="return false;"></div>
      </div>

      <!-- Правая колонка: Ближайшие слоты -->
      <div class="upcoming-section">
        <h3 class="page-title" style="margin-top: 0; margin-bottom: 25px;">Мои слоты</h3>
        <div id="upcomingBookingsList" class="booking-list">
          <div class="text-center" style="color: var(--color-text-muted); font-size: 14px;">Загрузка...</div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/calendar.js"></script>
</body>
</html>
