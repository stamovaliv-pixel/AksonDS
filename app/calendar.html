<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь записей - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .app-header {
      margin-top: 0;
      box-shadow: none; 
      border-bottom: none;
      padding-bottom: 15px; 
    }
    
    .top-gradient-bar {
      width: 100%;
      height: 2px; 
      background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end));
      margin-bottom: 20px; 
    }

    .header-nav {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .nav-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      transition: transform 0.2s ease;
      text-decoration: none;
    }
    .nav-icon:hover {
      transform: scale(1.15);
    }

    .calendar-layout {
      display: flex;
      flex-direction: column;
      gap: 40px; 
      margin-top: 20px;
    }
    
    .grid-section, .upcoming-section { width: 100%; }
    
    .section-title {
      margin: 0 0 25px 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
      color: var(--color-text-main);
    }

    .weekdays-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
      margin-bottom: 12px; 
      text-align: center;
      font-weight: 600;
      color: var(--color-text-muted);
      font-size: 14px;
    }
    
    .calendar-grid, .booking-list {
      display: grid;
      grid-template-columns: repeat(7, 1fr); 
      gap: 12px; 
    }
    
    .day-cell {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      height: 75px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .day-cell:hover:not(.inactive) {
      border-color: var(--color-primary);
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.05);
    }
    
    .day-cell::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background-color: #3b82f6; }
    .day-cell.booked::before { background-color: var(--color-primary); }
    .day-cell.inactive { opacity: 0.4; background-color: #f1f5f9; cursor: default; pointer-events: none; box-shadow: none; }
    .day-cell.inactive::before { display: none; }
    .date-text { font-size: 16px; font-weight: 700; color: var(--color-text-main); }
    
    .booking-item {
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-primary); 
      border-radius: var(--radius-sm);
      background: #fff;
      height: 75px; 
      display: flex;
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      box-sizing: border-box;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .booking-item:hover { border-color: var(--color-primary); transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.05); }
    .booking-date { font-weight: 700; color: var(--color-text-main); font-size: 15px; }
    .booking-time { font-size: 13px; color: var(--color-text-muted); margin-top: 4px; text-align: center; }

    /* Модальное окно */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
    .modal-content { background: #fff; padding: 25px; border-radius: var(--radius-md); width: 100%; max-width: 420px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--color-border); padding-bottom: 15px; }
    .modal-title { margin: 0; font-size: 18px; color: var(--color-text-main); font-weight: 700; }
    .modal-actions { display: flex; align-items: center; gap: 15px; }
    .close-btn { background: none; border: none; font-size: 26px; line-height: 1; cursor: pointer; color: var(--color-text-muted); }
    .close-btn:hover { color: var(--color-text-main); }
    .trash-btn { background: none; border: none; cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
    .trash-btn:hover { transform: scale(1.1); }
    .modal-body p { margin: 12px 0; font-size: 15px; color: var(--color-text-main); }
    .modal-body strong { color: var(--color-text-muted); font-weight: 500; display: inline-block; width: 130px; }

    /* =========================================
       АДАПТИВ ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ
       ========================================= */
    @media (max-width: 768px) {
      .header-nav { gap: 10px; }
      .section-title { font-size: 20px; margin-bottom: 15px; }
      .calendar-layout { gap: 30px; }
      
      /* Сужаем сетку календаря */
      .weekdays-header, .calendar-grid { gap: 4px; }
      .weekdays-header { font-size: 12px; margin-bottom: 8px; }
      .day-cell { height: 60px; border-radius: 6px; }
      .date-text { font-size: 13px; } /* Шрифт меньше, чтобы дата точно влезла */

      /* Меняем вывод карточек слотов с 7 колонок на 2 */
      .booking-list { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .booking-item { padding: 10px; }
    }

    @media (max-width: 480px) {
      /* Для самых маленьких экранов (iPhone SE и т.д.) */
      .weekdays-header, .calendar-grid { gap: 2px; }
      .day-cell { height: 50px; }
      .date-text { font-size: 12px; }
      .booking-date { font-size: 14px; }
      .booking-time { font-size: 12px; }
      
      /* Карточки слотов выводим в 1 колонку */
      .booking-list { grid-template-columns: 1fr; }
      .modal-body strong { display: block; width: auto; margin-bottom: 2px; }
    }
  </style>
</head>
<body class="app-body">
  <header class="app-header">
    <div class="header-logo">
      <img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo">
    </div>
    
    <div class="header-nav">
      <a href="calendar.html" class="nav-icon" title="Календарь">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </a>
      <a href="dashboard.html" class="nav-icon" title="Личный кабинет">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
        </svg>
      </a>
      <a href="#" id="logoutBtn" class="nav-icon" title="Выйти">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </a>
    </div>
  </header>
  
  <div class="top-gradient-bar"></div>
  
  <main class="container">
    <div class="calendar-layout">
      
      <div class="grid-section">
        <h2 class="section-title">Календарь</h2>
        <div class="weekdays-header">
          <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
        </div>
        <div class="calendar-grid" id="calendarGrid" oncontextmenu="return false;"></div>
      </div>

      <div class="upcoming-section">
        <h2 class="section-title">Мои слоты</h2>
        <div id="upcomingBookingsList" class="booking-list">
          <div style="grid-column: 1 / -1; color: var(--color-text-muted); font-size: 14px;">Загрузка...</div>
        </div>
      </div>

    </div>
  </main>

  <div class="modal-overlay" id="bookingDetailsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Детали записи</h3>
        <div class="modal-actions">
          <button class="trash-btn" id="deleteBookingBtn" title="Отменить запись">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
          <button class="close-btn" id="closeDetailsModalBtn">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <p><strong>Дата:</strong> <span id="modalDate"></span></p>
        <p><strong>Время:</strong> <span id="modalTime"></span></p>
        <p><strong>Тип поставки:</strong> <span id="modalType"></span></p>
        <p><strong>Документ:</strong> <span id="modalDoc"></span></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/calendar.js"></script>
</body>
</html>
