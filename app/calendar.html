<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Календарь записей - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .app-header {
      margin-top: 0;
      box-shadow: none; 
      border-bottom: none;
      padding-bottom: 15px; 
    }
    
    .top-gradient-bar {
      width: 100%;
      height: 4.8px; 
      background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end));
      margin-bottom: 20px; 
    }

    /* Теперь блоки идут друг под другом */
    .calendar-layout {
      display: flex;
      flex-direction: column;
      gap: 40px; /* Отступ между календарем и слотами */
      margin-top: 20px;
    }
    
    .grid-section, .upcoming-section {
      width: 100%;
    }
    
    .section-title {
      margin: 0 0 25px 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
      color: var(--color-text-main);
    }

    /* Сетка календаря */
    .weekdays-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
      margin-bottom: 12px; 
      text-align: center;
      font-weight: 600;
      color: var(--color-text-muted);
      font-size: 14px;
    }
    
    .calendar-grid, .booking-list {
      display: grid;
      grid-template-columns: repeat(7, 1fr); /* 7 колонок для идеального совпадения ширины */
      gap: 12px; 
    }
    
    .day-cell {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      height: 75px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .day-cell:hover:not(.inactive) {
      border-color: var(--color-primary);
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.05);
    }
    
    .day-cell::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background-color: rgba(16, 185, 129, 0.8); 
    }
    .day-cell.booked::before {
      background-color: var(--color-primary); 
    }
    
    .day-cell.inactive {
      opacity: 0.4;
      background-color: #f1f5f9;
      cursor: default;
      pointer-events: none;
      box-shadow: none;
    }
    .day-cell.inactive::before { display: none; }
    .date-text { font-size: 16px; font-weight: 700; color: var(--color-text-main); }
    
    /* Карточки слотов (теперь выглядят как иконки дат) */
    .booking-item {
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-primary); 
      border-radius: var(--radius-sm);
      background: #fff;
      height: 75px; 
      display: flex;
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      box-sizing: border-box;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .booking-item:hover {
      border-color: var(--color-primary);
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.05);
    }
    
    .booking-date { font-weight: 700; color: var(--color-text-main); font-size: 15px; }
    .booking-time { font-size: 13px; color: var(--color-text-muted); margin-top: 4px; }

    /* --- Стили для модального окна --- */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
    }
    .modal-content { 
      background: #fff; padding: 25px 30px; border-radius: var(--radius-md); 
      width: 100%; max-width: 420px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-header { 
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; 
      border-bottom: 1px solid var(--color-border); padding-bottom: 15px;
    }
    .modal-title { margin: 0; font-size: 18px; color: var(--color-text-main); font-weight: 700; }
    .modal-actions { display: flex; align-items: center; gap: 15px; }
    
    .close-btn { background: none; border: none; font-size: 26px; line-height: 1; cursor: pointer; color: var(--color-text-muted); }
    .close-btn:hover { color: var(--color-text-main); }
    
    /* Синяя корзина */
    .trash-btn { 
      background: none; border: none; cursor: pointer; padding: 5px; 
      display: flex; align-items: center; justify-content: center; transition: transform 0.2s;
    }
    .trash-btn:hover { transform: scale(1.1); }
    
    .modal-body p { margin: 12px 0; font-size: 15px; color: var(--color-text-main); }
    .modal-body strong { color: var(--color-text-muted); font-weight: 500; display: inline-block; width: 130px; }
  </style>
</head>
<body class="app-body">
  <header class="app-header">
    <div class="header-logo">
      <img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo">
    </div>
    <div class="header-nav">
      <a href="dashboard.html">Личный кабинет</a>
      <a href="calendar.html" class="active">Календарь</a>
      <a href="#" id="logoutBtn" style="color: var(--color-primary);">Выйти</a>
    </div>
  </header>
  
  <div class="top-gradient-bar"></div>
  
  <main class="container">
    <div class="calendar-layout">
      
      <!-- Блок Календаря -->
      <div class="grid-section">
        <h2 class="section-title">Календарь</h2>
        <div class="weekdays-header">
          <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
        </div>
        <div class="calendar-grid" id="calendarGrid" oncontextmenu="return false;"></div>
      </div>

      <!-- Блок Мои слоты (Под календарем) -->
      <div class="upcoming-section">
        <h2 class="section-title">Мои слоты</h2>
        <div id="upcomingBookingsList" class="booking-list">
          <div style="grid-column: 1 / -1; color: var(--color-text-muted); font-size: 14px;">Загрузка...</div>
        </div>
      </div>

    </div>
  </main>

  <!-- Модальное окно детализации записи -->
  <div class="modal-overlay" id="bookingDetailsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Детали записи</h3>
        <div class="modal-actions">
          <!-- Синяя корзина -->
          <button class="trash-btn" id="deleteBookingBtn" title="Отменить запись">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
          <button class="close-btn" id="closeDetailsModalBtn">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <p><strong>Дата:</strong> <span id="modalDate"></span></p>
        <p><strong>Время:</strong> <span id="modalTime"></span></p>
        <p><strong>Тип поставки:</strong> <span id="modalType"></span></p>
        <p><strong>Документ:</strong> <span id="modalDoc"></span></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/calendar.js"></script>
</body>
</html>
