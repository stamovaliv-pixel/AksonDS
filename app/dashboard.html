<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .app-header { margin-top: 0; box-shadow: none; border-bottom: none; padding-bottom: 15px; }
    .top-gradient-bar { width: 100%; height: 2px; background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end)); margin-bottom: 20px; }
    .header-nav { display: flex; gap: 20px; align-items: center; }
    .nav-icon { display: inline-flex; align-items: center; justify-content: center; padding: 5px; transition: transform 0.2s ease; text-decoration: none; }
    .nav-icon:hover { transform: scale(1.15); }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: var(--color-text-main); font-size: 14px; }
    
    /* Единый стиль для всех строк ввода */
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input-row input {
      flex: 1;
      width: 100%;
      padding: 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      background-color: #f8fafc;
      box-sizing: border-box;
    }
    .input-row input:not(:disabled) {
      background-color: #fff;
      border-color: var(--color-primary);
    }
    
    /* Кнопки действий (иконки) */
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: background-color 0.2s;
      flex-shrink: 0;
    }
    .action-btn:hover { background-color: #f1f5f9; }
    .save-btn { color: #10b981; display: none; }
    
    /* Невидимый элемент-пустышка для точного выравнивания почты с остальными полями */
    .action-placeholder {
      width: 30px;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="app-body">
  <header class="app-header">
    <div class="header-logo">
      <img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo">
    </div>
    
    <div class="header-nav">
      <a href="calendar.html" class="nav-icon" title="Календарь">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </a>
      
      <a href="dashboard.html" class="nav-icon" title="Личный кабинет">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
        </svg>
      </a>
      
      <a href="#" id="logoutBtn" class="nav-icon" title="Выйти">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </a>
    </div>
  </header>
  
  <div class="top-gradient-bar"></div>
  
  <main class="container mt-4" style="display: flex; flex-direction: column; align-items: center;">
    <h1 class="page-title" style="align-self: flex-start; width: 100%; max-width: 600px; margin: 0 auto 20px;">Личный кабинет</h1>
    
    <div class="auth-card w-100" style="max-width: 600px; margin-bottom: 20px; padding: 25px;">
      <h3 class="card-title" style="margin-top: 0; font-size: 18px;">Реквизиты организации</h3>
      <p class="card-text" style="color: var(--color-text-main); font-size: 15px; margin-bottom: 0;">
        <strong style="color: var(--color-text-muted);">ИНН:</strong> <span id="orgInn">Загрузка...</span><br><br>
        <strong style="color: var(--color-text-muted);">Наименование:</strong> <span id="orgName">Загрузка...</span>
      </p>
    </div>

    <div class="auth-card w-100" style="max-width: 600px; padding: 25px;">
      <h3 class="card-title" style="margin-top: 0; font-size: 18px; margin-bottom: 20px;">Контактные данные</h3>
      
      <!-- ФИО -->
      <div class="form-group">
        <label>ФИО</label>
        <div class="input-row">
          <input type="text" id="profileName" disabled value="Загрузка...">
          <button type="button" class="action-btn edit-btn" data-target="profileName" title="Редактировать">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          </button>
          <button type="button" class="action-btn save-btn" data-field="full_name" title="Сохранить">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </div>
      </div>
      
      <!-- Телефон -->
      <div class="form-group">
        <label>Телефон</label>
        <div class="input-row">
          <input type="text" id="profilePhone" disabled value="Загрузка...">
          <button type="button" class="action-btn edit-btn" data-target="profilePhone" title="Редактировать">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          </button>
          <button type="button" class="action-btn save-btn" data-field="phone" title="Сохранить">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </div>
      </div>
      
      <!-- Почта (добавлен пустой блок-заглушка для сохранения одинаковой ширины инпута) -->
      <div class="form-group" style="margin-bottom: 0;">
        <label>Почта</label>
        <div class="input-row">
          <input type="email" id="profileEmail" disabled value="Загрузка...">
          <div class="action-placeholder"></div>
        </div>
      </div>
      
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
