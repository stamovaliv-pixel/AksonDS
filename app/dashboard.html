<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* Стили для шапки и иконок навигации */
    .app-header { margin-top: 0; box-shadow: none; border-bottom: none; padding-bottom: 15px; }
    
    /* Градиентная полоса стала тоньше (2px) */
    .top-gradient-bar { width: 100%; height: 2px; background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end)); margin-bottom: 20px; }
    
    /* Иконки в шапке */
    .header-nav { display: flex; gap: 20px; align-items: center; }
    .nav-icon { display: inline-flex; align-items: center; justify-content: center; padding: 5px; transition: transform 0.2s ease; text-decoration: none; }
    .nav-icon:hover { transform: scale(1.15); }
  </style>
</head>
<body class="app-body">
  <header class="app-header">
    <div class="header-logo">
      <img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo">
    </div>
    
    <div class="header-nav">
      <!-- 1. Календарь -->
      <a href="calendar.html" class="nav-icon" title="Календарь">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </a>
      
      <!-- 2. Личный кабинет -->
      <a href="dashboard.html" class="nav-icon" title="Личный кабинет">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </a>
      
      <!-- 3. Выйти (ID logoutBtn сохранен для корректной работы JS) -->
      <a href="#" id="logoutBtn" class="nav-icon" title="Выйти">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </a>
    </div>
  </header>
  
  <!-- Разделитель перенесен под шапку -->
  <div class="top-gradient-bar"></div>
  
  <main class="container mt-4">
    <h1 class="page-title">Личный кабинет</h1>
    <div class="auth-card w-100 mt-3" style="max-width: none;">
      <h3 class="card-title">Организация</h3>
      <p class="card-text">
        <strong>ИНН:</strong> <span id="orgInn">Загрузка...</span><br><br>
        <strong>Наименование:</strong> <span id="orgName">Загрузка...</span>
      </p>
    </div>
  </main>

  <!-- Подключение скриптов -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
