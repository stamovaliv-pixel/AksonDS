<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .app-header { margin-top: 0; box-shadow: none; border-bottom: none; padding-bottom: 15px; }
    .top-gradient-bar { width: 100%; height: 2px; background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end)); margin-bottom: 20px; }
    .header-nav { display: flex; gap: 20px; align-items: center; }
    .nav-icon { display: inline-flex; align-items: center; justify-content: center; padding: 5px; transition: transform 0.2s ease; text-decoration: none; }
    .nav-icon:hover { transform: scale(1.15); }
    
    .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: var(--color-text-main); font-size: 14px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); margin-bottom: 15px; font-size: 15px; }
    .form-group input:focus { outline: none; border-color: var(--color-primary); }
    .btn-save { background-color: var(--color-primary); color: white; border: none; padding: 12px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; width: 100%; transition: background-color 0.2s; }
    .btn-save:hover { opacity: 0.9; }
    .btn-save:disabled { background-color: #cbd5e1; cursor: not-allowed; }
  </style>
</head>
<body class="app-body">
  <header class="app-header">
    <div class="header-logo">
      <img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo">
    </div>
    
    <div class="header-nav">
      <!-- Календарь -->
      <a href="calendar.html" class="nav-icon" title="Календарь">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </a>
      
      <!-- Личный кабинет -->
      <a href="dashboard.html" class="nav-icon" title="Личный кабинет">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
        </svg>
      </a>
      
      <!-- Выйти -->
      <a href="#" id="logoutBtn" class="nav-icon" title="Выйти">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </a>
    </div>
  </header>
  
  <div class="top-gradient-bar"></div>
  
  <main class="container mt-4" style="display: flex; flex-direction: column; align-items: center;">
    <h1 class="page-title" style="align-self: flex-start; width: 100%; max-width: 600px; margin: 0 auto 20px;">Личный кабинет</h1>
    
    <!-- Данные организации (Только чтение) -->
    <div class="auth-card w-100" style="max-width: 600px; margin-bottom: 20px; padding: 25px;">
      <h3 class="card-title" style="margin-top: 0; font-size: 18px;">Реквизиты организации</h3>
      <p class="card-text" style="color: var(--color-text-main); font-size: 15px; margin-bottom: 0;">
        <strong style="color: var(--color-text-muted);">ИНН:</strong> <span id="orgInn">Загрузка...</span><br><br>
        <strong style="color: var(--color-text-muted);">Наименование:</strong> <span id="orgName">Загрузка...</span>
      </p>
    </div>

    <!-- Личные данные (Редактируемые) -->
    <div class="auth-card w-100" style="max-width: 600px; padding: 25px;">
      <h3 class="card-title" style="margin-top: 0; font-size: 18px; margin-bottom: 20px;">Контактные данные</h3>
      
      <form id="profileForm">
        <div class="form-group">
          <label>ФИО</label>
          <input type="text" id="profileName" placeholder="Введите ФИО" required>
        </div>
        
        <div class="form-group">
          <label>Телефон</label>
          <input type="text" id="profilePhone" placeholder="+7 (___) ___-__-__" required>
        </div>
        
        <div class="form-group" style="margin-bottom: 25px;">
          <label>Почта</label>
          <input type="email" id="profileEmail" placeholder="example@mail.ru" required>
        </div>
        
        <button type="submit" class="btn-save" id="saveProfileBtn">Сохранить изменения</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
