<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Запись - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .app-header { margin-top: 0; box-shadow: none; border-bottom: none; padding-bottom: 15px; }
    .top-gradient-bar { width: 100%; height: 2px; background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end)); margin-bottom: 15px; }
    
    .header-nav { display: flex; gap: 20px; align-items: center; }
    .nav-icon { display: inline-flex; align-items: center; justify-content: center; padding: 5px; transition: transform 0.2s ease; text-decoration: none; }
    .nav-icon:hover { transform: scale(1.15); }

    .day-container { max-width: 900px; margin: 0 auto; }
    .day-navigation { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #fff; padding: 10px 20px; border-radius: var(--radius-md); border: 1px solid var(--color-border); }
    .nav-btn { background: transparent; border: 1px solid var(--color-border); padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 500; color: var(--color-text-main); transition: all 0.2s; }
    .nav-btn:hover:not(:disabled) { background: #f1f5f9; border-color: #cbd5e1; }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Группировка слотов */
    .time-group { margin-bottom: 25px; }
    .time-group-title { font-size: 16px; font-weight: 700; color: var(--color-text-main); margin-bottom: 12px; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; }
    
    .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .slot-card { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 15px; text-align: center; transition: all 0.2s ease; display: flex; flex-direction: column; justify-content: space-between; min-height: 110px; }
    .slot-card:hover:not(.inactive) { border-color: #3b82f6; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .slot-card.inactive { background-color: #f8fafc; opacity: 0.6; border-color: #e2e8f0; pointer-events: none; }
    .slot-time { font-size: 17px; font-weight: 700; color: var(--color-text-main); margin-bottom: 6px; }
    .slot-status { font-size: 13px; font-weight: 600; margin-bottom: 12px; line-height: 1.3; }
    .slot-status.status-info { color: #334155; margin-bottom: 8px; }
    .slot-status.status-available { color: #059669; }
    .slot-status.status-reserve { color: #b45309; }
    .slot-status.status-warning { color: #b45309; }
    .slot-status.status-muted { color: #64748b; }
    .slot-status.status-unavailable { color: #ef4444; }
    .slot-status.status-availability { font-size: 11px; font-weight: 500; color: #64748b; margin: 7px 0 0; }

    /* Компактный список записей поставщика в пределах карточки часа */
    .slot-card.has-supplier-bookings { text-align: left; align-items: stretch; justify-content: flex-start; min-height: 0; padding: 10px 11px; }
    .slot-card.has-supplier-bookings .slot-time { text-align: center; margin-bottom: 6px; }
    .supplier-bookings { display: flex; flex-direction: column; gap: 4px; margin: 0; text-align: left; }
    .supplier-booking-row { display: flex; align-items: center; min-width: 0; gap: 6px; padding: 5px 6px; border: 1px solid #f2b8bd; border-radius: 7px; background: #fffafa; cursor: pointer; transition: background-color .15s ease, border-color .15s ease; box-shadow: inset 0 0 0 1px rgba(239,68,68,.025); }
    .supplier-booking-row:hover, .supplier-booking-row:focus-visible { background: #eef4fc; border-color: #93c5fd; outline: none; }
    .supplier-booking-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .supplier-booking-header { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .supplier-booking-title { color: #1e293b; font-weight: 700; font-size: 12px; line-height: 1.25; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
    .supplier-booking-type-icons { display: flex; align-items: center; flex-wrap: wrap; gap: 3px; min-height: 16px; }
    .supplier-booking-type-icon { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 17px; border: 1px solid #dbe3ec; border-radius: 4px; background: #fff; color: #334155; font-size: 12px; line-height: 1; cursor: help; box-sizing: border-box; }
    .supplier-booking-type-icon:focus-visible { outline: 2px solid #3b82f6; outline-offset: 1px; }
    .supplier-booking-edit, .supplier-booking-add { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 28px; height: 28px; min-width: 28px; min-height: 28px; padding: 0; border-radius: 6px; cursor: pointer; box-sizing: border-box; transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
    .supplier-booking-edit { border: 1px solid #dbeafe; background: #eff6ff; color: #2563eb; }
    .supplier-booking-edit:hover { background: #dbeafe; color: #1d4ed8; }
    .supplier-booking-edit svg, .supplier-booking-add svg { width: 15px; height: 15px; display: block; }
    .supplier-booking-add-wrap { display: flex; justify-content: center; align-items: center; margin-top: 4px; }
    .supplier-booking-add { width: 29px; height: 29px; min-width: 29px; min-height: 29px; border: 1px solid #bfdbfe; background: #eff6ff; color: #2563eb; border-radius: 50%; }
    .supplier-booking-add:hover { border-color: #60a5fa; background: #dbeafe; color: #1d4ed8; }
    .slot-card.has-supplier-bookings .slot-status { margin-bottom: 4px; }

    .btn-book, .btn-cancel, .btn-disabled { width: 100%; padding: 8px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-book { background-color: #3b82f6; color: white; }
    .btn-book:hover { background-color: #2563eb; }
    .btn-cancel { background-color: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn-cancel:hover { background-color: #e2e8f0; }
    .btn-disabled { background-color: #e2e8f0; color: #94a3b8; cursor: not-allowed; }

    /* Модальные окна */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
    .modal-content { background: #fff; padding: 30px; border-radius: var(--radius-md); width: 100%; max-width: 500px; position: relative; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .modal-header h3 { margin: 0; font-size: 20px; color: var(--color-text-main); }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #64748b; line-height: 1; transition: 0.2s; }
    .close-btn:hover { color: #ef4444; }
    
    /* Формы и сетка полей */
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--color-text-main); }
    .form-group input[type="text"], .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--color-border); border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none; resize: none; }
    .form-group input[type="text"]:focus, .form-group select:focus, .form-group textarea:focus { border-color: #3b82f6; }
    
    .form-row { display: flex; gap: 15px; flex-wrap: wrap; }
    .form-row .form-group { flex: 1; min-width: 150px; margin-bottom: 18px; }

    /* Переопределение инлайн-запрета переноса строк для галочек (из JS) */
    #supplyTypesGroup label { white-space: normal !important; }

    /* Индикатор ТК */
    .tk-dot-modal { width: 12px; height: 12px; border-radius: 50%; display: inline-block; transition: 0.2s; flex-shrink: 0; }
    .tk-dot-modal.active { background-color: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.6); animation: blink 1.5s infinite; }
    .tk-dot-modal.inactive { background-color: #cbd5e1; box-shadow: none; animation: none; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Кнопки файлов */
    .file-wrapper { display: flex; gap: 10px; align-items: stretch; margin-top: 4px; }
    .custom-file-upload { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 6px; cursor: pointer; color: #475569; font-size: 13px; font-weight: 500; transition: 0.2s; }
    .custom-file-upload:hover { background: #f1f5f9; border-color: #94a3b8; }
    .template-btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 15px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; text-decoration: none; color: #475569; font-size: 13px; font-weight: 500; transition: 0.2s; white-space: nowrap; }
    .template-btn:hover { background: #f8fafc; border-color: #94a3b8; color: #1e293b; }

    .btn-save { background: #10b981; color: #fff; border: none; padding: 14px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; font-size: 16px; margin-top: 10px; transition: 0.2s; }
    .btn-save:hover { background: #059669; }
    .btn-red { background: #ef4444; color: #fff; border: none; padding: 14px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; font-size: 16px; margin-top: 10px; transition: 0.2s; }
    .btn-red:hover { background: #dc2626; }
    
    .detail-row { margin-bottom: 12px; font-size: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
    .detail-label { color: var(--color-text-muted); font-size: 13px; margin-bottom: 4px; }
    .detail-value { font-weight: 600; color: var(--color-text-main); }

    .action-buttons { display: flex; gap: 10px; margin-top: 15px; }

    html[data-theme="dark"] .supplier-booking-row { background: #202b37; border-color: #9f5961; box-shadow: inset 0 0 0 1px rgba(248,113,113,.05); }
    html[data-theme="dark"] .supplier-booking-row:hover,
    html[data-theme="dark"] .supplier-booking-row:focus-visible { background: #293849; border-color: #60a5fa; }
    html[data-theme="dark"] .supplier-booking-title { color: #e6edf5; }
    html[data-theme="dark"] .supplier-booking-type-icon { background: #111923; border-color: #465466; color: #e6edf5; }
    html[data-theme="dark"] .supplier-booking-edit { background: #172b46; border-color: #315781; color: #93c5fd; }
    html[data-theme="dark"] .supplier-booking-edit:hover { background: #203d61; color: #dbeafe; }
    html[data-theme="dark"] .supplier-booking-add { background: #172b46; border-color: #315781; color: #93c5fd; }
    html[data-theme="dark"] .supplier-booking-add:hover { background: #203d61; border-color: #60a5fa; color: #dbeafe; }
    html[data-theme="dark"] .slot-card .slot-status.status-info { color: #e6edf5 !important; }
    html[data-theme="dark"] .slot-card .slot-status.status-available { color: #34d399 !important; }
    html[data-theme="dark"] .slot-card .slot-status.status-reserve,
    html[data-theme="dark"] .slot-card .slot-status.status-warning { color: #fbbf24 !important; }
    html[data-theme="dark"] .slot-card .slot-status.status-muted,
    html[data-theme="dark"] .slot-card .slot-status.status-availability { color: #a5b2c2 !important; }
    html[data-theme="dark"] .slot-card .slot-status.status-unavailable { color: #f87171 !important; }

    @media (max-width: 767px) {
      .slot-card.has-supplier-bookings { padding: 8px 7px; }
      .supplier-booking-row { padding: 4px 5px; gap: 4px; }
      .supplier-booking-title { font-size: 11px; }
      .supplier-booking-edit { width: 26px; height: 26px; min-width: 26px; min-height: 26px; }
      .supplier-booking-add { width: 28px; height: 28px; min-width: 28px; min-height: 28px; }
      .supplier-booking-type-icons { gap: 2px; }
      .supplier-booking-type-icon { width: 19px; height: 16px; font-size: 11px; }
    }

    /* === МОБИЛЬНАЯ АДАПТАЦИЯ МОДАЛЬНЫХ ОКОН === */
    @media (max-width: 768px) {
      .day-navigation { padding: 10px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; justify-content: center; }
      .page-title { order: -1; width: 100%; margin-bottom: 10px !important; }
      .slot-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      
      .modal-overlay { padding: 10px; }
      .modal-content { padding: 20px 15px; max-height: 95vh; border-radius: 12px; }
      .modal-header { margin-bottom: 15px; }
      .modal-header h3 { font-size: 18px; }
      
      .form-group { margin-bottom: 12px; }
      .form-row { flex-direction: column; gap: 0; }
      .form-row .form-group { width: 100%; min-width: auto; margin-bottom: 12px; }
      
      #supplyTypesGroup { flex-direction: column !important; gap: 8px !important; }
      #supplyTypesGroup label { width: 100%; padding: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; margin: 0 !important; }
      
      .file-wrapper { flex-direction: column; }
      .custom-file-upload, .template-btn { width: 100%; }
      
      .action-buttons { flex-direction: column; gap: 8px; }
      .action-buttons button { width: 100%; margin: 0; }
    }
  </style>

  <link rel="stylesheet" href="../css/dark-mode.css?v=4">
  <link rel="stylesheet" href="../css/mobile-refinements.css?v=2" media="(max-width: 767px)">
  <script>try{if(localStorage.getItem("akson-dockslot-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
</head>
<body class="app-body">
  <header class="app-header">
    <div class="header-logo"><img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo"></div>
    <div class="header-nav">
      <a href="calendar.html" class="nav-icon" title="Календарь"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></a>
      <a href="#" id="logoutBtn" class="nav-icon" title="Выйти"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></a>
    </div>
  </header>
  <div class="top-gradient-bar"></div>
  
  <main class="container day-container">
    <a href="calendar.html" class="link-action" style="display: inline-block; margin-bottom: 15px; font-weight: 500; font-size: 14px;">&larr; Назад к графику</a>
    
    <div class="day-navigation">
      <button id="prevDayBtn" class="nav-btn">&larr; Пред. день</button>
      <h1 class="page-title" style="margin: 0; font-size: 20px; text-align: center; flex: 1;">Слоты на: <span id="currentDateDisplay" style="color: var(--color-primary);">...</span></h1>
      <button id="nextDayBtn" class="nav-btn">След. день &rarr;</button>
    </div>
    
    <div id="slotsContainer">
      <div style="padding: 40px; text-align: center; color: var(--color-text-muted);">Загрузка расписания...</div>
    </div>
  </main>

  <!-- Модальное окно 1: Оформление / Редактирование записи -->
  <div class="modal-overlay" id="bookingModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="bookingModalTitle">Оформление записи</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <form id="bookingForm">
        <input type="hidden" id="selectedHour">
        
        <div class="form-group">
          <label>Тип поставки (можно выбрать несколько)</label>
          <div id="supplyTypesGroup" style="display: flex; gap: 12px; flex-wrap: wrap;"></div>
        </div>

        <!-- ИЗМЕНЕНИЕ: Формы в специальном flex-контейнере -->
        <div class="form-row">
          <div class="form-group">
            <label>Тип документа</label>
            <select id="orderType" required>
              <option value="order">Заказ</option>
              <option value="upd">УПД</option>
              <option value="etrn">ЭТрН</option>
            </select>
          </div>
          <div class="form-group">
            <label>Номер документа</label>
            <input type="text" id="orderNumber" required placeholder="№ документа">
          </div>
        </div>

        <div class="form-group">
          <label>Реестр поставки (.csv)</label>
          <div class="file-wrapper">
            <label class="custom-file-upload">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              <span id="fileName">Загрузить реестр</span>
              <input type="file" id="registryFile" accept=".csv" style="display: none;">
            </label>
            <a id="downloadTemplateBtn" href="#" target="_blank" class="template-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Шаблон
            </a>
          </div>
        </div>

        <div class="form-group" id="tkWrapper" style="display: flex; align-items: center; gap: 8px; cursor: pointer; width: max-content;">
          <div id="tkDot" class="tk-dot-modal inactive"></div>
          <label style="margin:0; cursor: pointer; user-select: none;">Привезет транспортная компания</label>
        </div>

        <div class="form-group" style="margin-top: 15px;">
          <label>Комментарий (до 320 символов)</label>
          <textarea id="bookingComment" maxlength="320" rows="3" placeholder="Дополнительная информация..."></textarea>
        </div>

        <button type="submit" class="btn-save" id="submitBookingBtn">Подтвердить запись</button>
      </form>
    </div>
  </div>

  <!-- Модальное окно 2: Детали записи -->
  <div class="modal-overlay" id="bookingDetailsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Ваша запись</h3>
        <button class="close-btn" id="closeDetailsModalBtn">&times;</button>
      </div>
      <div class="detail-row"><div class="detail-label">Дата и время</div><div class="detail-value"><span id="modalDate"></span>, <span id="modalTime"></span></div></div>
      <div class="detail-row"><div class="detail-label">Тип поставки</div><div class="detail-value" id="modalType"></div></div>
      <div class="detail-row"><div class="detail-label">Документ</div><div class="detail-value" id="modalDoc"></div></div>
      <div class="detail-row"><div class="detail-label">Транспортная компания</div><div class="detail-value" id="modalTk"></div></div>
      <div class="detail-row"><div class="detail-label">Реестр</div><div class="detail-value"><a id="modalFileLink" href="#" target="_blank" style="color: #3b82f6;">Скачать файл</a></div></div>
      <div class="detail-row" style="border: none;"><div class="detail-label">Комментарий</div><div class="detail-value" id="modalComment" style="font-weight: normal; font-size: 14px;"></div></div>
      
      <div class="action-buttons">
        <button class="btn-book" id="editBookingBtn" style="flex: 1; padding: 14px; font-size: 16px;">Изменить</button>
        <button class="btn-red" id="deleteBookingBtn" style="flex: 1; padding: 14px; font-size: 16px; margin-top: 0;">Отменить запись</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/day.js?v=28-supplier-compact-booking-rows"></script>
  <script src="../js/theme-toggle.js?v=3"></script>
</body>
</html>
