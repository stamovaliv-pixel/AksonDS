<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Запись - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .app-header { margin-top: 0; box-shadow: none; border-bottom: none; padding-bottom: 15px; }
    .top-gradient-bar { width: 100%; height: 2px; background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end)); margin-bottom: 15px; }
    
    .header-nav { display: flex; gap: 20px; align-items: center; }
    .nav-icon { display: inline-flex; align-items: center; justify-content: center; padding: 5px; transition: transform 0.2s ease; text-decoration: none; }
    .nav-icon:hover { transform: scale(1.15); }

    .day-container { max-width: 900px; margin: 0 auto; }
    .day-navigation { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #fff; padding: 10px 20px; border-radius: var(--radius-md); border: 1px solid var(--color-border); }
    .nav-btn { background: transparent; border: 1px solid var(--color-border); padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 500; color: var(--color-text-main); transition: all 0.2s; }
    .nav-btn:hover:not(:disabled) { background: #f1f5f9; border-color: #cbd5e1; }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Группировка слотов поставщика: одинаковые фиксированные карточки */
    .time-group { margin-bottom: 25px; }
    .time-group-title { font-size: 16px; font-weight: 700; color: var(--color-text-main); margin-bottom: 12px; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; }
    .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 12px; align-items: stretch; }
    .slot-card {
      position: relative; isolation: isolate; overflow: hidden; box-sizing: border-box;
      height: 166px; min-height: 166px; max-height: 166px; min-width: 0;
      background: #fff; border: 1px solid #d8e0e9; border-radius: 11px;
      padding: 11px 10px 10px 14px; text-align: center;
      display: flex; flex-direction: column; align-items: stretch; justify-content: space-between; gap: 6px;
      box-shadow: 0 1px 2px rgba(15,23,42,.035);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, background-color .2s ease;
    }
    .slot-card::before { content: ''; position: absolute; z-index: 0; left: 0; top: 0; bottom: 0; width: 4px; background: #2563eb; }
    .slot-card > * { position: relative; z-index: 1; }
    .slot-card.slot-free::before { background: #2563eb; }
    .slot-card.slot-booked::before { background: #ef4444; }
    .slot-card.slot-full::before, .slot-card.slot-closed::before { background: #9ca3af; }
    .slot-card:hover:not(.inactive), .slot-card:focus-within:not(.inactive) {
      transform: translateY(-3px); border-color: #93c5fd; box-shadow: 0 9px 20px rgba(15,23,42,.12);
    }
    .slot-card.inactive { background: #f3f4f6; border-color: #d1d5db; cursor: not-allowed; }
    .slot-card.inactive::before { background: #9ca3af; }
    .slot-time { flex: 0 0 auto; font-size: 16px; font-weight: 750; line-height: 1.2; color: #1e293b; margin: 0; white-space: nowrap; }
    .slot-status { flex: 0 0 auto; font-size: 12px; line-height: 1.2; font-weight: 600; margin: 0; min-height: 15px; }
    .slot-status.status-info { color: #334155; }
    .slot-status.status-available { color: #047857; }
    .slot-status.status-reserve, .slot-status.status-warning { color: #92400e; }
    .slot-status.status-muted { color: #64748b; }
    .slot-status.status-unavailable { color: #6b7280; }
    .slot-status.status-availability { font-size: 11px; font-weight: 600; color: #64748b; }

    .btn-book, .btn-cancel, .btn-disabled {
      box-sizing: border-box; width: 100%; min-height: 34px; padding: 7px 8px; border: 1px solid transparent;
      border-radius: 8px; font-size: 13px; line-height: 1.2; font-weight: 700; cursor: pointer;
      transition: background-color .18s ease, border-color .18s ease, transform .18s ease;
    }
    .btn-book { background: #2563eb; color: #fff; border-color: #2563eb; }
    .btn-book:hover { background: #1d4ed8; border-color: #1d4ed8; transform: translateY(-1px); }
    .btn-cancel { background: #f1f5f9; color: #334155; border-color: #cbd5e1; }
    .btn-cancel:hover { background: #e2e8f0; }
    .btn-disabled { background: #e5e7eb; color: #6b7280; border-color: #d1d5db; cursor: not-allowed; }

    .supplier-bookings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; width: 100%; min-width: 0; margin: auto 0; }
    .supplier-booking-row {
      appearance: none; -webkit-appearance: none; box-sizing: border-box; min-width: 0; width: 100%; aspect-ratio: 1 / 1;
      display: flex; align-items: center; justify-content: center; padding: 3px; overflow: hidden;
      border: 1.5px solid #ef4444; border-radius: 10px; background: #fff7f7; color: #b91c1c;
      text-align: center; font-family: inherit; font-size: clamp(9px, .9vw, 12px); line-height: 1.12; font-weight: 750;
      white-space: normal; overflow-wrap: anywhere; cursor: pointer;
      transition: transform .16s ease, background-color .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .supplier-booking-row:hover, .supplier-booking-row:focus-visible { background: #fee2e2; border-color: #dc2626; transform: translateY(-2px); box-shadow: 0 3px 8px rgba(220,38,38,.13); outline: none; }
    .supplier-booking-row:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
    .supplier-booking-row.is-add { border-color: #60a5fa; background: #eff6ff; color: #2563eb; }
    .supplier-booking-row.is-add:hover, .supplier-booking-row.is-add:focus-visible { border-color: #2563eb; background: #dbeafe; color: #1d4ed8; }
    .supplier-booking-row.is-add svg { width: 23px; height: 23px; display: block; flex: 0 0 auto; }
    .supplier-booking-row.is-disabled { border-color: #d1d5db; background: #f3f4f6; color: #9ca3af; opacity: .62; cursor: not-allowed; transform: none; box-shadow: none; }
    .supplier-booking-row.is-disabled svg { opacity: .65; }

    /* Только локальная палитра страницы поставщика в тёмном режиме. */
    html[data-theme="dark"] .day-navigation { background: #18212b !important; border-color: #344150 !important; }
    html[data-theme="dark"] .time-group-title { color: #e6edf5; border-bottom-color: #344150; }
    html[data-theme="dark"] .slot-card { background: #18212b; border-color: #3b4858; box-shadow: 0 2px 6px rgba(0,0,0,.22); }
    html[data-theme="dark"] .slot-card.slot-free { border-color: #3b526e; }
    html[data-theme="dark"] .slot-card.slot-booked { border-color: #75404a; }
    html[data-theme="dark"] .slot-card.slot-full, html[data-theme="dark"] .slot-card.slot-closed,
    html[data-theme="dark"] .slot-card.inactive { background: #202833 !important; border-color: #46515e !important; }
    html[data-theme="dark"] .slot-time { color: #f1f5f9; }
    html[data-theme="dark"] .slot-status.status-info { color: #dbe7f5; }
    html[data-theme="dark"] .slot-status.status-available { color: #6ee7b7; }
    html[data-theme="dark"] .slot-status.status-reserve, html[data-theme="dark"] .slot-status.status-warning { color: #fcd34d; }
    html[data-theme="dark"] .slot-status.status-muted, html[data-theme="dark"] .slot-status.status-availability { color: #b6c4d6; }
    html[data-theme="dark"] .slot-status.status-unavailable { color: #cbd5e1; }
    html[data-theme="dark"] .supplier-booking-row { background: #2d2025; border-color: #f87171; color: #fecaca; }
    html[data-theme="dark"] .supplier-booking-row:hover, html[data-theme="dark"] .supplier-booking-row:focus-visible { background: #43262d; border-color: #fca5a5; }
    html[data-theme="dark"] .supplier-booking-row.is-add { background: #172b46; border-color: #60a5fa; color: #bfdbfe; }
    html[data-theme="dark"] .supplier-booking-row.is-add:hover, html[data-theme="dark"] .supplier-booking-row.is-add:focus-visible { background: #203d61; border-color: #93c5fd; color: #eff6ff; }
    html[data-theme="dark"] .supplier-booking-row.is-disabled { background: #252e39; border-color: #596678; color: #93a0b2; opacity: .8; }
    html[data-theme="dark"] .btn-book { background: #2563eb; color: #fff; border-color: #3b82f6; }
    html[data-theme="dark"] .btn-book:hover { background: #3b82f6; }
    html[data-theme="dark"] .btn-disabled { background: #343d49; color: #a5b2c2; border-color: #556171; }
    html[data-theme="dark"] .nav-btn { color: #e6edf5; border-color: #465466; }
    html[data-theme="dark"] .nav-btn:hover:not(:disabled) { background: #202b37; border-color: #64748b; }

    @media (max-width: 767px) {
      .slot-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .slot-card { height: 202px; min-height: 202px; max-height: 202px; padding: 12px 12px 10px 15px; }
      .supplier-bookings { gap: 8px; }
      .supplier-booking-row { font-size: 12px; border-radius: 11px; }
      .supplier-booking-row.is-add svg { width: 26px; height: 26px; }
    }

    /* Базовые стили модальных окон. Важно: по умолчанию оба окна скрыты. */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 15px;
      box-sizing: border-box;
    }
    .modal-content {
      background: #fff;
      padding: 30px;
      border-radius: var(--radius-md);
      width: 100%;
      max-width: 500px;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      box-sizing: border-box;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 12px;
    }
    .modal-header h3 {
      margin: 0;
      font-size: 20px;
      color: var(--color-text-main);
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #64748b;
      line-height: 1;
      flex: 0 0 auto;
      transition: color .2s ease;
    }
    .close-btn:hover { color: #ef4444; }

    /* Формы и сетка полей */
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--color-text-main); }
    .form-group input[type="text"], .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--color-border); border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none; resize: none; }
    .form-group input[type="text"]:focus, .form-group select:focus, .form-group textarea:focus { border-color: #3b82f6; }
    
    .form-row { display: flex; gap: 15px; flex-wrap: wrap; }
    .form-row .form-group { flex: 1; min-width: 150px; margin-bottom: 18px; }

    /* Переопределение инлайн-запрета переноса строк для галочек (из JS) */
    #supplyTypesGroup label { white-space: normal !important; }

    /* Индикатор ТК */
    .tk-dot-modal { width: 12px; height: 12px; border-radius: 50%; display: inline-block; transition: 0.2s; flex-shrink: 0; }
    .tk-dot-modal.active { background-color: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.6); animation: blink 1.5s infinite; }
    .tk-dot-modal.inactive { background-color: #cbd5e1; box-shadow: none; animation: none; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Кнопки файлов */
    .file-wrapper { display: flex; gap: 10px; align-items: stretch; margin-top: 4px; }
    .custom-file-upload { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 6px; cursor: pointer; color: #475569; font-size: 13px; font-weight: 500; transition: 0.2s; }
    .custom-file-upload:hover { background: #f1f5f9; border-color: #94a3b8; }
    .template-btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 15px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; text-decoration: none; color: #475569; font-size: 13px; font-weight: 500; transition: 0.2s; white-space: nowrap; }
    .template-btn:hover { background: #f8fafc; border-color: #94a3b8; color: #1e293b; }

    .btn-save { background: #10b981; color: #fff; border: none; padding: 14px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; font-size: 16px; margin-top: 10px; transition: 0.2s; }
    .btn-save:hover { background: #059669; }
    .btn-red { background: #ef4444; color: #fff; border: none; padding: 14px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; font-size: 16px; margin-top: 10px; transition: 0.2s; }
    .btn-red:hover { background: #dc2626; }
    
    .detail-row { margin-bottom: 12px; font-size: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
    .detail-label { color: var(--color-text-muted); font-size: 13px; margin-bottom: 4px; }
    .detail-value { font-weight: 600; color: var(--color-text-main); }

    .action-buttons { display: flex; gap: 10px; margin-top: 15px; }

    /* === МОБИЛЬНАЯ АДАПТАЦИЯ МОДАЛЬНЫХ ОКОН === */
    @media (max-width: 768px) {
      .day-navigation { padding: 10px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; justify-content: center; }
      .page-title { order: -1; width: 100%; margin-bottom: 10px !important; }
      /* Слоты остаются одной колонкой на телефоне, чтобы три квадратные кнопки помещались по ширине. */
      .slot-grid { grid-template-columns: minmax(0, 1fr); }
      
      .modal-overlay { padding: 10px; }
      .modal-content { padding: 20px 15px; max-height: 95vh; border-radius: 12px; }
      .modal-header { margin-bottom: 15px; }
      .modal-header h3 { font-size: 18px; }
      
      .form-group { margin-bottom: 12px; }
      .form-row { flex-direction: column; gap: 0; }
      .form-row .form-group { width: 100%; min-width: auto; margin-bottom: 12px; }
      
      #supplyTypesGroup { flex-direction: column !important; gap: 8px !important; }
      #supplyTypesGroup label { width: 100%; padding: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; margin: 0 !important; }
      
      .file-wrapper { flex-direction: column; }
      .custom-file-upload, .template-btn { width: 100%; }
      
      .action-buttons { flex-direction: column; gap: 8px; }
      .action-buttons button { width: 100%; margin: 0; }
    }
  </style>

  <link rel="stylesheet" href="../css/dark-mode.css?v=supplier-fixed-slots-v1">
  <link rel="stylesheet" href="../css/mobile-refinements.css?v=2" media="(max-width: 767px)">
  <style>
    /* Scoped supplier-only dark-mode contrast fixes, loaded after shared dark-mode CSS. */
    html[data-theme="dark"] body.supplier-day-page .slot-card.slot-free { background: #18212b !important; border-color: #3b526e !important; }
    html[data-theme="dark"] body.supplier-day-page .slot-card.slot-booked { background: #241b22 !important; border-color: #75404a !important; }
    html[data-theme="dark"] body.supplier-day-page .slot-card.slot-full,
    html[data-theme="dark"] body.supplier-day-page .slot-card.slot-closed,
    html[data-theme="dark"] body.supplier-day-page .slot-card.inactive { background: #202833 !important; border-color: #46515e !important; }
    html[data-theme="dark"] body.supplier-day-page .slot-card .slot-time { color: #f1f5f9 !important; }
    html[data-theme="dark"] body.supplier-day-page .slot-card .slot-status.status-availability { color: #b6c4d6 !important; }
    html[data-theme="dark"] body.supplier-day-page .slot-card .slot-status.status-unavailable { color: #cbd5e1 !important; }
    html[data-theme="dark"] body.supplier-day-page .supplier-booking-row.is-booked { background: #2d2025 !important; border-color: #f87171 !important; color: #fecaca !important; }
    html[data-theme="dark"] body.supplier-day-page .supplier-booking-row.is-booked:hover,
    html[data-theme="dark"] body.supplier-day-page .supplier-booking-row.is-booked:focus-visible { background: #43262d !important; border-color: #fca5a5 !important; }
    html[data-theme="dark"] body.supplier-day-page .supplier-booking-row.is-add { background: #172b46 !important; border-color: #60a5fa !important; color: #bfdbfe !important; }
    html[data-theme="dark"] body.supplier-day-page .supplier-booking-row.is-add:hover,
    html[data-theme="dark"] body.supplier-day-page .supplier-booking-row.is-add:focus-visible { background: #203d61 !important; border-color: #93c5fd !important; color: #eff6ff !important; }
    html[data-theme="dark"] body.supplier-day-page .supplier-booking-row.is-disabled { background: #252e39 !important; border-color: #596678 !important; color: #93a0b2 !important; opacity: .8 !important; }
  </style>
  <script>try{if(localStorage.getItem("akson-dockslot-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
</head>
<body class="app-body supplier-day-page">
  <header class="app-header">
    <div class="header-logo"><img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo"></div>
    <div class="header-nav">
      <a href="calendar.html" class="nav-icon" title="Календарь"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></a>
      <a href="#" id="logoutBtn" class="nav-icon" title="Выйти"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></a>
    </div>
  </header>
  <div class="top-gradient-bar"></div>
  
  <main class="container day-container">
    <a href="calendar.html" class="link-action" style="display: inline-block; margin-bottom: 15px; font-weight: 500; font-size: 14px;">&larr; Назад к графику</a>
    
    <div class="day-navigation">
      <button id="prevDayBtn" class="nav-btn">&larr; Пред. день</button>
      <h1 class="page-title" style="margin: 0; font-size: 20px; text-align: center; flex: 1;">Слоты на: <span id="currentDateDisplay" style="color: var(--color-primary);">...</span></h1>
      <button id="nextDayBtn" class="nav-btn">След. день &rarr;</button>
    </div>
    
    <div id="slotsContainer">
      <div style="padding: 40px; text-align: center; color: var(--color-text-muted);">Загрузка расписания...</div>
    </div>
  </main>

  <!-- Модальное окно 1: Оформление / Редактирование записи -->
  <div class="modal-overlay" id="bookingModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="bookingModalTitle">Оформление записи</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <form id="bookingForm">
        <input type="hidden" id="selectedHour">
        
        <div class="form-group">
          <label>Тип поставки (можно выбрать несколько)</label>
          <div id="supplyTypesGroup" style="display: flex; gap: 12px; flex-wrap: wrap;"></div>
        </div>

        <!-- ИЗМЕНЕНИЕ: Формы в специальном flex-контейнере -->
        <div class="form-row">
          <div class="form-group">
            <label>Тип документа</label>
            <select id="orderType" required>
              <option value="order">Заказ</option>
              <option value="upd">УПД</option>
              <option value="etrn">ЭТрН</option>
            </select>
          </div>
          <div class="form-group">
            <label>Номер документа</label>
            <input type="text" id="orderNumber" required placeholder="№ документа">
          </div>
        </div>

        <div class="form-group">
          <label>Реестр поставки (.csv)</label>
          <div class="file-wrapper">
            <label class="custom-file-upload">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              <span id="fileName">Загрузить реестр</span>
              <input type="file" id="registryFile" accept=".csv" style="display: none;">
            </label>
            <a id="downloadTemplateBtn" href="#" target="_blank" class="template-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Шаблон
            </a>
          </div>
        </div>

        <div class="form-group" id="tkWrapper" style="display: flex; align-items: center; gap: 8px; cursor: pointer; width: max-content;">
          <div id="tkDot" class="tk-dot-modal inactive"></div>
          <label style="margin:0; cursor: pointer; user-select: none;">Привезет транспортная компания</label>
        </div>

        <div class="form-group" style="margin-top: 15px;">
          <label>Комментарий (до 320 символов)</label>
          <textarea id="bookingComment" maxlength="320" rows="3" placeholder="Дополнительная информация..."></textarea>
        </div>

        <button type="submit" class="btn-save" id="submitBookingBtn">Подтвердить запись</button>
      </form>
    </div>
  </div>

  <!-- Модальное окно 2: Детали записи -->
  <div class="modal-overlay" id="bookingDetailsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="bookingDetailsTitle">Подробнее</h3>
        <button class="close-btn" id="closeDetailsModalBtn">&times;</button>
      </div>
      <div class="detail-row"><div class="detail-label">Дата и время</div><div class="detail-value"><span id="modalDate"></span>, <span id="modalTime"></span></div></div>
      <div class="detail-row"><div class="detail-label">Тип поставки</div><div class="detail-value" id="modalType"></div></div>
      <div class="detail-row"><div class="detail-label">Документ</div><div class="detail-value" id="modalDoc"></div></div>
      <div class="detail-row"><div class="detail-label">Транспортная компания</div><div class="detail-value" id="modalTk"></div></div>
      <div class="detail-row"><div class="detail-label">Реестр</div><div class="detail-value"><a id="modalFileLink" href="#" target="_blank" style="color: #3b82f6;">Скачать файл</a></div></div>
      <div class="detail-row" style="border: none;"><div class="detail-label">Комментарий</div><div class="detail-value" id="modalComment" style="font-weight: normal; font-size: 14px;"></div></div>
      
      <div class="action-buttons">
        <button class="btn-book" id="editBookingBtn" style="flex: 1; padding: 14px; font-size: 16px;">Изменить</button>
        <button class="btn-red" id="deleteBookingBtn" style="flex: 1; padding: 14px; font-size: 16px; margin-top: 0;">Отменить запись</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/day.js?v=supplier-fixed-slots-no-supabase-v5"></script>
  <script src="../js/theme-toggle.js?v=3"></script>
</body>
</html>
