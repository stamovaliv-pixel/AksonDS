<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Слоты - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .app-header { margin-top: 0; box-shadow: none; border-bottom: none; padding-bottom: 15px; }
    
    /* Градиентная полоса стала тоньше (2px) */
    .top-gradient-bar { width: 100%; height: 2px; background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end)); margin-bottom: 15px; }
    
    /* Стили для иконок навигации */
    .header-nav { display: flex; gap: 20px; align-items: center; }
    .nav-icon { display: inline-flex; align-items: center; justify-content: center; padding: 5px; transition: transform 0.2s ease; text-decoration: none; }
    .nav-icon:hover { transform: scale(1.15); }

    .day-container { max-width: 900px; margin: 0 auto; }
    .day-navigation { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #fff; padding: 10px 20px; border-radius: var(--radius-md); border: 1px solid var(--color-border); }
    .nav-btn { background: transparent; border: 1px solid var(--color-border); padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 500; color: var(--color-text-main); transition: all 0.2s; }
    .nav-btn:hover:not(:disabled) { background: #f1f5f9; border-color: #cbd5e1; }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .time-group { margin-bottom: 15px; }
    .time-group-title { font-size: 16px; font-weight: 700; color: var(--color-text-main); margin-bottom: 8px; border-bottom: 2px solid #e2e8f0; padding-bottom: 4px; }
    
    .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .slot-card { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 10px 12px; text-align: center; transition: all 0.2s ease; display: flex; flex-direction: column; justify-content: space-between; }
    .slot-card:hover:not(.inactive) { border-color: #3b82f6; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .slot-card.inactive { background-color: #f8fafc; opacity: 0.6; border-color: #e2e8f0; }
    .slot-time { font-size: 16px; font-weight: 700; color: var(--color-text-main); margin-bottom: 4px; }
    .slot-status { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    
    .btn-book, .btn-cancel, .btn-disabled { width: 100%; padding: 6px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
    .btn-book { background-color: #3b82f6; color: white; }
    .btn-book:hover { background-color: #2563eb; }
    .btn-cancel { background-color: #ef4444; color: white; }
    .btn-cancel:hover { background-color: #dc2626; }
    .btn-disabled { background-color: #cbd5e1; color: #64748b; cursor: not-allowed; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center; box-sizing: border-box; padding: 15px;}
    .modal-content { background: #fff; padding: 25px; border-radius: var(--radius-md); width: 100%; max-width: 400px; position: relative; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--color-border); padding-bottom: 10px; }
    .close-btn { background: none; border: none; font-size: 26px; line-height: 1; cursor: pointer; color: var(--color-text-muted); }
    .trash-btn { background: none; border: none; cursor: pointer; padding: 5px; display: flex; align-items: center; transition: transform 0.2s; }
    .trash-btn:hover { transform: scale(1.1); }
    .modal-body p { margin: 10px 0; font-size: 14px; color: var(--color-text-main); }
    .modal-body strong { color: var(--color-text-muted); font-weight: 500; display: inline-block; width: 120px; }

    /* =========================================
       АДАПТИВ ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ
       ========================================= */
    @media (max-width: 768px) {
      .header-nav { gap: 10px; }
      .day-navigation { padding: 10px; margin-bottom: 15px; }
      .page-title { font-size: 16px !important; }
      .nav-btn { padding: 6px 10px; font-size: 13px; }
      
      /* Сжимаем карточки слотов */
      .slot-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
      .slot-card { padding: 10px; }
      .slot-time { font-size: 15px; }
      .slot-status { font-size: 12px; }
    }

    @media (max-width: 480px) {
      /* Для маленьких экранов (iPhone) */
      .day-navigation { padding: 8px; }
      .nav-btn { padding: 5px 8px; font-size: 12px; }
      .page-title { font-size: 14px !important; }
      
      /* Слоты в одну колонку, чтобы ничего не сжималось */
      .slot-grid { grid-template-columns: 1fr; }
      .slot-card { padding: 12px; }
      .slot-time { font-size: 16px; }
      .slot-status { font-size: 13px; }
      
      /* Увеличиваем кнопки, чтобы удобно нажимать пальцем */
      .btn-book, .btn-cancel, .btn-disabled { padding: 10px; font-size: 14px; }
      
      /* Адаптируем модальные окна */
      .modal-content { padding: 15px; }
      .modal-header { margin-bottom: 15px; padding-bottom: 10px; }
      .modal-body p { font-size: 13px; margin: 8px 0; }
    }
  </style>
</head>
<body class="app-body">
  <header class="app-header">
    <div class="header-logo">
      <img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo">
    </div>
    
    <!-- Новое навигационное меню с иконками -->
    <div class="header-nav">
      <!-- 1. Календарь -->
      <a href="calendar.html" class="nav-icon" title="Календарь">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </a>
      
      <!-- 2. Личный кабинет -->
      <a href="dashboard.html" class="nav-icon" title="Личный кабинет">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </a>
      
      <!-- 3. Выйти (сохранен ID для JS) -->
      <a href="#" id="logoutBtn" class="nav-icon" title="Выйти">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </a>
    </div>
  </header>
  
  <div class="top-gradient-bar"></div>
  
  <main class="container day-container">
    <a href="calendar.html" class="link-action" style="display: inline-block; margin-bottom: 15px; font-weight: 500; font-size: 14px;">&larr; Назад к графику</a>
    
    <div class="day-navigation">
      <button id="prevDayBtn" class="nav-btn">&larr; Пред. день</button>
      <h1 class="page-title" style="margin: 0; font-size: 20px; text-align: center; flex: 1;">Слоты на: <span id="currentDateDisplay" style="color: var(--color-primary);">...</span></h1>
      <button id="nextDayBtn" class="nav-btn">След. день &rarr;</button>
    </div>
    
    <div id="slotsContainer">
      <div style="padding: 40px; text-align: center; color: var(--color-text-muted);">Загрузка расписания...</div>
    </div>
  </main>

  <!-- Модальное окно 1: Оформление записи -->
  <div class="modal-overlay" id="bookingModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin: 0; font-size: 18px; color: var(--color-text-main);">Оформление записи</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <form id="bookingForm">
        <input type="hidden" id="selectedHour">
        <div class="form-group" style="margin-bottom: 12px;">
          <label style="display: block; margin-bottom: 4px; font-weight: 500; font-size: 14px;">Тип поставки</label>
          <select id="supplyType" required style="width:100%; padding: 8px; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">
            <option value="orders_im">Заказы ИМ</option>
            <option value="mix">МИКС</option>
            <option value="return">Возврат</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom: 12px;">
          <label style="display: block; margin-bottom: 4px; font-weight: 500; font-size: 14px;">Тип документа</label>
          <select id="orderType" required style="width:100%; padding: 8px; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">
            <option value="order">Заказ поставщику</option>
            <option value="upd">УПД</option>
            <option value="etrn">ЭТрН</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 4px; font-weight: 500; font-size: 14px;">Номер документа</label>
          <input type="text" id="orderNumber" required placeholder="Например: 12345678" style="width:100%; padding: 8px; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">
        </div>
        <button type="submit" class="btn-book" id="submitBookingBtn">Подтвердить запись</button>
      </form>
    </div>
  </div>

  <!-- Модальное окно 2: Детали записи -->
  <div class="modal-overlay" id="bookingDetailsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin: 0; font-size: 18px; color: var(--color-text-main);">Детали записи</h3>
        <div style="display: flex; align-items: center; gap: 10px;">
          <button class="trash-btn" id="deleteBookingBtn" title="Отменить запись">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
          <button class="close-btn" id="closeDetailsModalBtn">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <p><strong>Дата:</strong> <span id="modalDate"></span></p>
        <p><strong>Время:</strong> <span id="modalTime"></span></p>
        <p><strong>Тип поставки:</strong> <span id="modalType"></span></p>
        <p><strong>Документ:</strong> <span id="modalDoc"></span></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/day.js"></script>
</body>
</html>
