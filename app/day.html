<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запись на слот - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .slot-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--color-border);
      transition: background-color 0.2s;
    }
    .slot-row:last-child { border-bottom: none; }
    .slot-row:hover { background-color: #f8fafc; }
    .slot-time { font-size: 18px; font-weight: 600; color: var(--color-text-main); }
    .slot-status { font-size: 14px; font-weight: 500; color: #10b981; }
    .slot-status.full { color: var(--color-primary); }
    .slot-row.full-row { background-color: #f1f5f9; opacity: 0.8; }
    
    /* Модальное окно */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center;
    }
    .modal-content { background: #fff; padding: 30px; border-radius: var(--radius-md); width: 100%; max-width: 450px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--color-text-muted); }
  </style>
</head>
<body class="app-body">
  <div class="top-gradient-bar"></div>
  <header class="app-header">
    <div class="header-logo">
      <img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo">
    </div>
    <div class="header-nav">
      <a href="dashboard.html">Личный кабинет</a>
      <a href="calendar.html" class="active">Календарь</a>
    </div>
  </header>
  
  <main class="container mt-4">
    <a href="calendar.html" class="link-action" style="display: inline-block; margin-bottom: 15px;">&larr; Назад к календарю</a>
    <h1 class="page-title">Запись на: <span id="currentDateDisplay" style="color: var(--color-primary);">...</span></h1>
    
    <div class="auth-card w-100 mt-3" style="max-width: 800px; padding: 0; overflow: hidden;">
      <div id="slotsContainer">
        <!-- Слоты сгенерируются через JS -->
        <div style="padding: 20px; text-align: center;">Загрузка расписания...</div>
      </div>
    </div>
  </main>

  <!-- Модальное окно записи -->
  <div class="modal-overlay" id="bookingModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin: 0;">Оформление записи</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <form id="bookingForm">
        <input type="hidden" id="selectedHour">
        <div class="form-group">
          <label>Тип поставки</label>
          <select id="supplyType" required style="width:100%; padding: 12px; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">
            <option value="orders_im">Заказы ИМ</option>
            <option value="mix">МИКС</option>
            <option value="return">Возврат</option>
          </select>
        </div>
        <div class="form-group">
          <label>Тип документа</label>
          <select id="orderType" required style="width:100%; padding: 12px; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">
            <option value="order">Заказ поставщику</option>
            <option value="upd">УПД</option>
            <option value="etrn">ЭТрН</option>
          </select>
        </div>
        <div class="form-group">
          <label>Номер документа</label>
          <input type="text" id="orderNumber" required placeholder="Например: 12345678">
        </div>
        <button type="submit" class="btn-primary w-100 mt-3" id="submitBookingBtn">Подтвердить запись</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/day.js"></script>
</body>
</html>
