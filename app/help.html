<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f9">
  <title>Помощь — Аксон ДокСлот</title>
  <link rel="stylesheet" href="../css/theme.css?v=4-1-date-exceptions">
  <link rel="stylesheet" href="../css/main.css?v=4-1-date-exceptions">
  <link rel="stylesheet" href="../css/dark-mode.css?v=5-role-calendar-colors">
  <link rel="stylesheet" href="../css/mobile-refinements.css?v=2">
  <link rel="stylesheet" href="../css/admin-navigation.css?v=10-supplier-nav-fixed-order">
  <link rel="stylesheet" href="../css/notifications.css?v=6-floating-bell-theme">
  <style>
    .help-wrap { width: min(100% - 36px, 1120px); margin: 26px auto 56px; }
    .help-hero { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; }
    .help-kicker { display:inline-block; margin-bottom:7px; color:var(--color-text-muted); font-size:10px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
    .help-hero h1 { margin:0; color:var(--color-text-main); font-size:clamp(25px,3vw,34px); letter-spacing:-.035em; }
    .help-hero p { max-width:580px; margin:8px 0 0; color:var(--color-text-muted); font-size:13px; line-height:1.55; }
    .help-role { display:inline-flex; align-items:center; gap:7px; flex:0 0 auto; padding:8px 12px; border:1px solid var(--color-border); border-radius:999px; color:var(--color-text-muted); font-size:11px; font-weight:700; }
    .help-role svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; }
    .help-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .help-card { min-width:0; padding:20px; border:1px solid var(--color-border); border-radius:17px; background:var(--color-surface); box-shadow:var(--shadow-sm); }
    .help-card h2 { display:flex; align-items:center; gap:10px; margin:0 0 12px; color:var(--color-text-main); font-size:15px; font-weight:760; }
    .help-card h2 svg { width:20px; height:20px; flex:0 0 20px; fill:none; stroke:#64748b; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .help-card p, .help-card li { color:var(--color-text-muted); font-size:12px; line-height:1.65; }
    .help-card p { margin:0 0 9px; }
    .help-card p:last-child { margin-bottom:0; }
    .help-card ol, .help-card ul { margin:0; padding-left:18px; }
    .help-card li + li { margin-top:6px; }
    .help-card strong { color:var(--color-text-main); font-weight:700; }
    .help-card-wide { grid-column:1 / -1; }
    .help-supply-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin:2px 0 10px; }
    .help-supply-item { display:flex; align-items:flex-start; gap:10px; min-width:0; padding:11px 12px; border:1px solid var(--color-border); border-radius:12px; background:var(--color-surface); }
    .help-supply-emoji { display:inline-flex; flex:0 0 30px; width:30px; height:30px; align-items:center; justify-content:center; border-radius:9px; background:rgba(100,116,139,.09); font-size:19px; }
    .help-supply-item strong { display:block; margin:0 0 3px; color:var(--color-text-main); font-size:12px; }
    .help-supply-item p { margin:0; font-size:11px; line-height:1.5; }
    .help-warning { margin:12px 0 !important; padding:11px 12px; border:1px solid rgba(217,119,6,.24); border-radius:11px; background:rgba(245,158,11,.08); color:var(--color-text-main) !important; }
    .help-warning strong { color:var(--color-text-main); }
    html[data-theme="dark"] .help-supply-item { background:#141d27; border-color:#344150; }
    html[data-theme="dark"] .help-supply-emoji { background:#202b37; }
    html[data-theme="dark"] .help-warning { background:rgba(245,158,11,.10); border-color:rgba(245,158,11,.24); }
    .help-note { margin-top:14px !important; padding:10px 12px; border-radius:10px; background:rgba(100,116,139,.08); }
    .help-loading { padding:40px; text-align:center; color:var(--color-text-muted); }
    @media(max-width:700px) { .help-supply-grid { grid-template-columns:1fr; } .help-wrap { width:min(100% - 24px,1120px); margin-top:20px; } .help-hero { align-items:flex-start; flex-direction:column; gap:12px; } .help-grid { grid-template-columns:1fr; } .help-card-wide { grid-column:auto; } .help-card { padding:16px; } }
    html[data-theme="dark"] .help-card { background:#18212b; border-color:#344150; }
    html[data-theme="dark"] .help-role { border-color:#344150; }
  </style>
</head>
<body class="app-body help-page">
  <div class="top-gradient-bar"></div>
  <header class="app-header">
    <div class="header-logo"><img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo"></div>
    <nav class="header-nav" aria-label="Навигация"></nav>
  </header>
  <main class="help-wrap">
    <div id="helpContent" class="help-loading" role="status" aria-live="polite">Загружаем инструкцию…</div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js?v=security-20261023"></script>
  <script src="../js/auth-profile.js?v=2-dashboard-profile"></script>
  <script src="../js/push-config.js?v=2-windows-push"></script>
  <script src="../js/notifications.js?v=moscow-time-v1"></script>
  <script src="../js/admin-navigation.js?v=14-operator-viewer-nav-order"></script>
  <script src="../js/help.js?v=4-supplier-guide-cleanup"></script>
  
</body>
</html>
