<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки системы - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .app-header { margin-top: 0; box-shadow: none; border-bottom: none; padding-bottom: 15px; }
    .top-gradient-bar { width: 100%; height: 2px; background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end)); margin-bottom: 20px; }
    .header-nav { display: flex; gap: 20px; align-items: center; }
    .nav-icon { display: inline-flex; align-items: center; justify-content: center; padding: 5px; transition: transform 0.2s ease; text-decoration: none; }
    
    .settings-card { background: #fff; padding: 25px; border-radius: var(--radius-md); border: 1px solid var(--color-border); margin-bottom: 20px; }
    .settings-section { margin-bottom: 30px; }
    .settings-section h3 { margin-top: 0; margin-bottom: 15px; font-size: 18px; color: var(--color-text-main); border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
    
    .form-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
    .form-group label { font-size: 13px; font-weight: 500; color: var(--color-text-muted); }
    .form-group input { padding: 10px; border: 1px solid var(--color-border); border-radius: 4px; font-size: 14px; }
    
    .days-grid { display: flex; gap: 15px; flex-wrap: wrap; }
    .day-checkbox { display: flex; align-items: center; gap: 5px; font-size: 14px; cursor: pointer; }
    
    .supply-list { list-style: none; padding: 0; margin: 0 0 15px 0; }
    .supply-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; margin-bottom: 5px; }
    .btn-remove { background: #fee2e2; color: #ef4444; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .add-supply-row { display: flex; gap: 10px; }
    
    .btn-primary { background: #3b82f6; color: #fff; border: none; padding: 12px 24px; border-radius: 4px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #10b981; color: #fff; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body class="app-body">
  <header class="app-header">
    <div class="header-logo"><img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo"></div>
    <div class="header-nav">
      <!-- Навигация. На другие страницы администратора также нужно добавить иконку шестеренки -->
      <a href="admin_calendar.html" class="nav-icon" title="Календарь"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></a>
      <a href="suppliers.html" class="nav-icon" title="Пользователи"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></a>
      <a href="analytics.html" class="nav-icon" title="Аналитика"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><polyline points="3 3 3 21 21 21"></polyline><polyline points="3 17 9 11 13 15 21 7"></polyline></svg></a>
      <a href="settings.html" class="nav-icon" title="Настройки"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></a>
      <a href="#" id="logoutBtn" class="nav-icon" title="Выйти"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></a>
    </div>
  </header>
  <div class="top-gradient-bar"></div>
  
  <main class="container" style="max-width: 800px; margin: 0 auto;">
    <h2 style="margin-top: 0;">Системные настройки</h2>
    
    <div class="settings-card">
      <div class="settings-section">
        <h3>Временные интервалы и лимиты</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Начало рабочего дня (час)</label>
            <input type="number" id="setStartHour" min="0" max="23">
          </div>
          <div class="form-group">
            <label>Конец рабочего дня (час)</label>
            <input type="number" id="setEndHour" min="0" max="23">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Кол-во доступных мест в 1 часе</label>
            <input type="number" id="setSlotsPerHour" min="1">
          </div>
          <div class="form-group">
            <label>Дедлайн записи (часов до начала слота)</label>
            <input type="number" id="setDeadline" min="0" title="Например, 1 = нельзя записаться менее чем за час до слота">
          </div>
        </div>
      </div>

      <div class="settings-section">
        <h3>Доступные дни недели для записи</h3>
        <div class="days-grid" id="daysGrid">
          <label class="day-checkbox"><input type="checkbox" value="1"> Пн</label>
          <label class="day-checkbox"><input type="checkbox" value="2"> Вт</label>
          <label class="day-checkbox"><input type="checkbox" value="3"> Ср</label>
          <label class="day-checkbox"><input type="checkbox" value="4"> Чт</label>
          <label class="day-checkbox"><input type="checkbox" value="5"> Пт</label>
          <label class="day-checkbox"><input type="checkbox" value="6"> Сб</label>
          <label class="day-checkbox"><input type="checkbox" value="7"> Вс</label>
        </div>
      </div>

      <div class="settings-section">
        <h3>Типы поставок</h3>
        <ul class="supply-list" id="supplyTypesList">
          <!-- Заполняется через JS -->
        </ul>
        <div class="add-supply-row">
          <input type="text" id="newSupplyName" placeholder="Название нового типа" style="flex: 1; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px;">
          <button class="btn-secondary" id="btnAddSupply">Добавить</button>
        </div>
      </div>

      <button class="btn-primary" id="btnSaveSettings" style="width: 100%;">Сохранить настройки</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
