<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки системы - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .app-header { margin-top: 0; box-shadow: none; border-bottom: none; padding-bottom: 15px; }
    .top-gradient-bar { width: 100%; height: 2px; background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end)); margin-bottom: 20px; }
    .header-nav { display: flex; gap: 20px; align-items: center; }
    .nav-icon { display: inline-flex; align-items: center; justify-content: center; padding: 5px; transition: transform 0.2s ease; text-decoration: none; }
    
    .settings-card { background: #fff; padding: 25px; border-radius: var(--radius-md); border: 1px solid var(--color-border); margin-bottom: 20px; }
    .settings-section { margin-bottom: 35px; }
    .settings-section-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 15px; }
    .settings-section-header h3 { margin: 0; font-size: 18px; color: var(--color-text-main); }
    
    .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed #e2e8f0; }
    .setting-row:last-child { border-bottom: none; }
    .setting-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .setting-label { font-size: 13px; font-weight: 600; color: var(--color-text-muted); }
    .setting-value { font-size: 15px; color: var(--color-text-main); font-weight: 500; }
    
    .setting-edit-input { display: none; padding: 6px 10px; border: 1px solid var(--color-primary); border-radius: 4px; font-size: 14px; max-width: 150px; outline: none; }
    
    .setting-actions { display: flex; gap: 8px; margin-left: 15px; }
    .btn-icon { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #64748b; transition: 0.2s; }
    .btn-icon:hover { background: #e2e8f0; color: #3b82f6; }
    .btn-icon.save { color: #10b981; border-color: #10b981; background: #ecfdf5; display: none; }
    .btn-icon.save:hover { background: #d1fae5; }
    
    .days-view { font-size: 15px; color: var(--color-text-main); font-weight: 500; }
    .days-chips { display: none; gap: 8px; flex-wrap: wrap; }
    .days-chips label { cursor: pointer; }
    .days-chips input { display: none; }
    .days-chips span { display: inline-block; padding: 6px 14px; border: 1px solid #cbd5e1; border-radius: 20px; color: #64748b; font-size: 13px; font-weight: 600; transition: 0.2s; user-select: none; }
    .days-chips input:checked + span { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    
    .supply-list { list-style: none; padding: 0; margin: 0; }
    .supply-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
    .btn-trash { background: none; border: none; color: #ef4444; cursor: pointer; display: none; padding: 4px; border-radius: 4px; }
    .btn-trash:hover { background: #fee2e2; }
    
    .supply-add-row { display: none; gap: 10px; margin-top: 15px; }
    .supply-add-row input { flex: 1; padding: 8px 12px; border: 1px solid var(--color-border); border-radius: 4px; font-size: 14px; }
    .btn-add { background: #3b82f6; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .btn-add:hover { background: #2563eb; }
  </style>
</head>
<body class="app-body">
  <header class="app-header">
    <div class="header-logo"><img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo"></div>
    <div class="header-nav">
      <a href="admin_calendar.html" class="nav-icon" title="Календарь"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></a>
      <a href="suppliers.html" class="nav-icon" title="Пользователи"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></a>
      <a href="analytics.html" class="nav-icon" title="Аналитика"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><polyline points="3 3 3 21 21 21"></polyline><polyline points="3 17 9 11 13 15 21 7"></polyline></svg></a>
      <a href="settings.html" class="nav-icon" title="Настройки"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></a>
      <a href="#" id="logoutBtn" class="nav-icon" title="Выйти"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></a>
    </div>
  </header>
  <div class="top-gradient-bar"></div>
  
  <main class="container" style="max-width: 800px; margin: 0 auto;">
    <h2 style="margin-top: 0;">Системные настройки</h2>
    
    <div class="settings-card">
      <div class="settings-section">
        <div class="settings-section-header">
          <h3>Временные интервалы и лимиты</h3>
        </div>
        
        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Начало первого слота</span>
            <span class="setting-value" id="view_startHour">Загрузка...</span>
            <select class="setting-edit-input" id="edit_startHour"></select>
          </div>
          <div class="setting-actions">
            <button class="btn-icon" id="btnEdit_startHour" title="Редактировать"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
            <button class="btn-icon save" id="btnSave_startHour" title="Сохранить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg></button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Начало последнего слота</span>
            <span class="setting-value" id="view_endHour">Загрузка...</span>
            <select class="setting-edit-input" id="edit_endHour"></select>
          </div>
          <div class="setting-actions">
            <button class="btn-icon" id="btnEdit_endHour" title="Редактировать"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
            <button class="btn-icon save" id="btnSave_endHour" title="Сохранить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg></button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Слотов в часе (кол-во)</span>
            <span class="setting-value" id="view_slotsPer">Загрузка...</span>
            <select class="setting-edit-input" id="edit_slotsPer"></select>
          </div>
          <div class="setting-actions">
            <button class="btn-icon" id="btnEdit_slotsPer" title="Редактировать"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
            <button class="btn-icon save" id="btnSave_slotsPer" title="Сохранить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg></button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Резервных слотов (только ИМ)</span>
            <span class="setting-value" id="view_reserveSlots">Загрузка...</span>
            <select class="setting-edit-input" id="edit_reserveSlots"></select>
          </div>
          <div class="setting-actions">
            <button class="btn-icon" id="btnEdit_reserveSlots" title="Редактировать"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
            <button class="btn-icon save" id="btnSave_reserveSlots" title="Сохранить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg></button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">Дедлайн записи (час)</span>
            <span class="setting-value" id="view_deadline">Загрузка...</span>
            <select class="setting-edit-input" id="edit_deadline"></select>
          </div>
          <div class="setting-actions">
            <button class="btn-icon" id="btnEdit_deadline" title="Редактировать"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
            <button class="btn-icon save" id="btnSave_deadline" title="Сохранить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg></button>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-header">
          <h3>Доступные дни недели</h3>
          <div class="setting-actions" style="margin-left: 0;">
            <button class="btn-icon" id="btnEdit_days" title="Редактировать"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
            <button class="btn-icon save" id="btnSave_days" title="Сохранить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg></button>
          </div>
        </div>
        <div class="days-view" id="view_days">Загрузка...</div>
        <div class="days-chips" id="edit_days">
          <label><input type="checkbox" value="1"><span>Пн</span></label>
          <label><input type="checkbox" value="2"><span>Вт</span></label>
          <label><input type="checkbox" value="3"><span>Ср</span></label>
          <label><input type="checkbox" value="4"><span>Чт</span></label>
          <label><input type="checkbox" value="5"><span>Пт</span></label>
          <label><input type="checkbox" value="6"><span>Сб</span></label>
          <label><input type="checkbox" value="7"><span>Вс</span></label>
        </div>
      </div>

      <div class="settings-section" style="margin-bottom: 0;">
        <div class="settings-section-header">
          <h3>Типы поставок</h3>
          <div class="setting-actions" style="margin-left: 0;">
            <button class="btn-icon" id="btnEdit_supply" title="Редактировать"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
            <button class="btn-icon save" id="btnSave_supply" title="Сохранить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg></button>
          </div>
        </div>
        
        <ul class="supply-list" id="supplyTypesList">
          <!-- Заполняется через JS -->
        </ul>
        
        <div class="supply-add-row" id="supplyAddRow">
          <input type="text" id="newSupplyName" placeholder="Название нового типа...">
          <button class="btn-add" id="btnAddSupply">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Добавить
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <!-- Добавляем параметр ?v=3 для надежной перезагрузки кэша браузера -->
  <script src="../js/settings.js?v=3"></script> 
</body>
</html>
