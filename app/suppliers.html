<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пользователи - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .app-header { margin-top: 0; box-shadow: none; border-bottom: none; padding-bottom: 15px; }
    .top-gradient-bar { width: 100%; height: 2px; background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end)); margin-bottom: 20px; }
    .header-nav { display: flex; gap: 20px; align-items: center; }
    .nav-icon { display: inline-flex; align-items: center; justify-content: center; padding: 5px; transition: transform 0.2s ease; text-decoration: none; }
    
    .search-box { background: #fff; padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--color-border); margin-bottom: 20px; }
    .search-box input { width: 100%; padding: 12px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: 15px; box-sizing: border-box; }
    
    .supplier-card { background: #fff; padding: 15px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; transition: 0.2s; border-left: 4px solid #10b981; }
    .supplier-card.blocked { border-left-color: #ef4444; background: #fef2f2; opacity: 0.8; }
    .sup-info { flex: 1; min-width: 250px; }
    .sup-name { font-size: 16px; font-weight: 700; color: var(--color-text-main); margin-bottom: 4px; }
    .sup-details { font-size: 13px; color: var(--color-text-muted); margin-bottom: 2px; }
    
    .btn-toggle { padding: 8px 15px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-block { background: #fee2e2; color: #ef4444; }
    .btn-unblock { background: #d1fae5; color: #10b981; }
  </style>
</head>
<body class="app-body">
  <header class="app-header">
    <div class="header-logo"><img src="../assets/logistic-logo.svg" alt="АКСОН Логистика" class="app-logo"></div>
    <div class="header-nav">
      <a href="admin_calendar.html" class="nav-icon" title="Календарь"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></a>
      <a href="suppliers.html" class="nav-icon" title="Пользователи"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></a>
      <a href="analytics.html" class="nav-icon" title="Аналитика"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><polyline points="3 3 3 21 21 21"></polyline><polyline points="3 17 9 11 13 15 21 7"></polyline></svg></a>
      <a href="#" id="logoutBtn" class="nav-icon" title="Выйти"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></a>
    </div>
  </header>
  <div class="top-gradient-bar"></div>
  
  <main class="container">
    <h2 style="margin-top: 0;">Управление пользователями</h2>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск по части ИНН, Названия или Почты...">
    </div>
    <div id="usersList">
      <div style="text-align:center; padding: 20px; color: #64748b;">Загрузка списка пользователей...</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/suppliers.js"></script>
</body>
</html>
