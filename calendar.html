<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Календарь записей - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 20px; }
    .day-cell { border: 1px solid #ddd; padding: 15px; border-radius: 4px; text-align: center; cursor: pointer; }
    .day-cell.free { background-color: #fff; }
    .day-cell.partial { background-color: #fcf3cf; }
    .day-cell.full { background-color: #e5e7e9; cursor: not-allowed; }
    .day-cell.mine { background-color: #fadbd8; border-color: var(--color-primary); }
    .day-cell:hover:not(.full) { border-color: var(--color-blue); }
  </style>
</head>
<body>
  <header class="header no-select">
    <div class="logo-container">
      <div class="logo">AKSon Logistics</div>
      <div class="gradient-line"></div>
    </div>
    <div class="nav-links">
      <a href="dashboard.html">Личный кабинет</a>
      <a href="calendar.html" class="active">Календарь</a>
      <a href="#" id="logoutBtn">Выйти</a>
    </div>
  </header>
  
  <main class="container mt-3">
    <h1>Выбор даты (ближайшие 30 дней)</h1>
    <div class="calendar-grid" id="calendarGrid" oncontextmenu="return false;">
      <!-- Сетка сгенерируется через JS -->
    </div>
  </main>
</body>
</html>
