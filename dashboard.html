<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Личный кабинет - AKSon Logistics</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <header class="header no-select">
    <div class="logo-container">
      <div class="logo">AKSon Logistics</div>
      <div class="gradient-line"></div>
    </div>
    <div class="nav-links">
      <a href="dashboard.html" class="active">Личный кабинет</a>
      <a href="calendar.html">Календарь</a>
      <a href="#" id="logoutBtn">Выйти</a>
    </div>
  </header>
  
  <main class="container mt-3">
    <h1>Личный кабинет</h1>
    <div class="card protected-data">
      <h3>Организация</h3>
      <p><strong>ИНН:</strong> <span id="orgInn">Загрузка...</span></p>
      <p><strong>Наименование:</strong> <span id="orgName">Загрузка...</span></p>
    </div>
    
    <div class="card mt-3">
      <h3>Ответственные лица <button class="btn-primary btn-sm float-right">+ Добавить</button></h3>
      <table class="table" oncontextmenu="return false;">
        <thead>
          <tr>
            <th>ФИО</th>
            <th>Телефон</th>
            <th>Основной</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="contactsTable">
          <!-- Данные загрузятся через JS -->
        </tbody>
      </table>
    </div>

    <div class="card mt-3">
      <h3>Статистика записей</h3>
      <p>Активных будущих записей: <strong id="activeBookingsCount">0</strong> из 30.</p>
    </div>
  </main>
</body>
</html>
