<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вход - AKSon Logistics</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* Единая стилистика с внутренними страницами портала */
    .top-gradient-bar { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, var(--color-gradient-start), var(--color-gradient-end)); }
    
    .auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f1f5f9; margin: 0; position: relative; padding: 20px; box-sizing: border-box; }
    
    .auth-card { background: #fff; padding: 40px; border-radius: var(--radius-md); box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border: 1px solid var(--color-border); box-sizing: border-box; }
    .auth-header { text-align: center; margin-bottom: 30px; }
    .brand-logo { max-height: 40px; }
    
    .form-title { text-align: center; margin: 0 0 25px 0; font-size: 22px; color: var(--color-text-main); font-weight: 700; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: var(--color-text-main); font-size: 14px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: 15px; box-sizing: border-box; transition: border-color 0.2s; background-color: #fff; }
    .form-group input:focus { outline: none; border-color: #3b82f6; }
    
    .btn-primary { background-color: #3b82f6; color: white; border: none; padding: 12px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: background-color 0.2s; }
    .btn-primary:hover { background-color: #2563eb; }
    
    .text-center { text-align: center; }
    .mt-4 { margin-top: 20px; }
    .link-action { color: #3b82f6; text-decoration: none; font-size: 14px; font-weight: 500; }
    .link-action:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .auth-card { padding: 25px 20px; }
    }
  </style>
</head>
<body class="auth-page">
  <div class="top-gradient-bar"></div>
  <main class="auth-card">
    <div class="auth-header no-select">
      <img src="assets/logistic-logo.svg" alt="АКСОН Логистика" class="brand-logo">
    </div>
    
    <h2 class="form-title">Вход в систему</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="Введите ваш email">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="password" required placeholder="Введите пароль">
      </div>
      <button type="submit" class="btn-primary w-100">Войти</button>
    </form>
    <div class="text-center mt-4">
      <a href="register.html" class="link-action">Зарегистрироваться</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
