<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вход - AKSon Logistics</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page">
  <div class="top-gradient-bar"></div>
  <main class="auth-card">
    <div class="auth-header no-select">
      <img src="assets/logistic-logo.svg" alt="АКСОН Логистика" class="brand-logo">
    </div>
    
    <h2 class="form-title">Вход в систему</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="Введите ваш email">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="password" required placeholder="Введите пароль">
      </div>
      <button type="submit" class="btn-primary w-100">Войти</button>
    </form>
    <div class="text-center mt-4">
      <a href="register.html" class="link-action">Зарегистрироваться</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
