<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход - AKSon Logistics</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="header no-select">
    <div class="logo-container">
      <div class="logo">AKSon Logistics</div>
      <div class="gradient-line"></div>
    </div>
  </header>
  
  <main class="login-container">
    <h2 class="form-title">Вход в систему</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="ivanov@company.ru">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn-primary w-100">Войти</button>
    </form>
    <p class="text-center mt-3">Нет аккаунта? <a href="register.html">Зарегистрироваться по ИНН</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
