<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация - AKSon Logistics</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="header no-select">
    <div class="logo-container">
      <div class="logo">AKSon Logistics</div>
      <div class="gradient-line"></div>
    </div>
    <div class="nav-links"><a href="index.html">Войти</a></div>
  </header>
  
  <main class="login-container" style="max-width: 500px;">
    <h2 class="form-title">Регистрация поставщика</h2>
    <form id="registerForm">
      <div class="form-group">
        <label>ИНН (10 или 12 цифр)</label>
        <input type="text" id="inn" required pattern="\d{10}|\d{12}" placeholder="7712345678">
      </div>
      <div class="form-group">
        <label>Наименование организации</label>
        <input type="text" id="company_name" required placeholder="ООО «Ромашка»">
      </div>
      <div class="form-group">
        <label>ФИО ответственного лица</label>
        <input type="text" id="full_name" required placeholder="Иванов Иван Иванович">
      </div>
      <div class="form-group">
        <label>Телефон</label>
        <input type="tel" id="phone" required placeholder="+7 (999) 123-45-67">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="ivanov@company.ru">
      </div>
      <div class="form-group">
        <label>Пароль (минимум 8 символов)</label>
        <input type="password" id="password" required minlength="8">
      </div>
      <button type="submit" class="btn-primary w-100">Зарегистрироваться</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
